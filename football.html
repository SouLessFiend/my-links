<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Football League Simulator</title>
    <!-- Подключаем Tailwind CSS для элитного дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">

    <!-- Шапка -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-500 text-slate-950 font-bold p-2.5 rounded-xl text-xl shadow-lg shadow-emerald-500/20">⚽</div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">GLOBAL SUPER LEAGUE</h1>
                    <p class="text-xs text-slate-400">Официальный симулятор сезона на 12 месяцев</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="season-badge" class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm font-medium text-emerald-400">
                    Статус: <span id="current-status-text">Месяц 1 / 12</span>
                </div>
                <button onclick="nextTour()" id="next-btn" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold px-5 py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-95">
                    Следующий месяц ➡️
                </button>
                <button onclick="resetSeason()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-4 py-2.5 rounded-xl transition-all border border-slate-700">
                    🔄 Сброс
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8 w-full flex-grow">
        
        <!-- Левая колонка: Матчи текущего месяца (Тура) -->
        <div class="lg:col-span-1 flex flex-col gap-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur-sm flex flex-col h-full">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        📅 <span id="month-title">Апрель</span>
                    </h2>
                    <span class="text-xs uppercase tracking-wider bg-slate-800 text-slate-400 px-3 py-1 rounded-full font-semibold">Тур <span id="tour-num">1</span></span>
                </div>

                <div id="matches-container" class="space-y-4 flex-grow flex flex-col justify-center">
                    <!-- Матчи генерируются через JS -->
                </div>
            </div>
        </div>

        <!-- Правая колонка: Турнирная таблица -->
        <div class="lg:col-span-2">
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        🏆 Турнирная таблица
                    </h2>
                    <p class="text-xs text-slate-400">* Шанс хет-трика (3+ голов): 7%</p>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                <th class="py-3 px-3">М</th>
                                <th class="py-3 px-3">Команда</th>
                                <th class="py-3 px-2 text-center">И</th>
                                <th class="py-3 px-2 text-center">В</th>
                                <th class="py-3 px-2 text-center">Н</th>
                                <th class="py-3 px-2 text-center">П</th>
                                <th class="py-3 px-2 text-center">З-П</th>
                                <th class="py-3 px-2 text-center">О</th>
                            </tr>
                        </thead>
                        <tbody id="standings-body" class="divide-y divide-slate-800/50 text-sm">
                            <!-- Строки таблицы генерируются через JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Футер -->
    <footer class="border-t border-slate-800 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
        <p>Global Football League Simulation Engine &bull; Все данные генерируются рандомно при каждом запуске</p>
    </footer>

    <!-- Скрипт симуляции -->
    <script>
        // 12 месяцев сезона по порядку
        const monthsList = [
            "Апрель", "Май", "Июнь", "Июль", 
            "Август", "Сентябрь", "Октябрь", "Ноябрь", 
            "Декабрь", "Январь", "Февраль", "Март"
        ];

        // 8 команд-участниц
        let teams = [
            { id: 1, name: "FC Lightning", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
            { id: 2, name: "Storm FC", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
            { id: 3, name: "Dynamo Apex", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
            { id: 4, name: "Titan SC", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
            { id: 5, name: "Phoenix United", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
            { id: 6, name: "Vanguard", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
            { id: 7, name: "Eclipse", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
            { id: 8, name: "Galaxy CF", p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }
        ];

        let currentMonthIndex = 0;
        let seasonFinished = false;
        let lastPlayedMatches = [];

        // Календарь матчей (парные игры по турам, круговая система на 12 туров)
        // Для 8 команд за 12 месяцев расписание генерируется циклически
        function getPairingsForTour(tour) {
            // Фиксированный алгоритм распределения соперников
            const t = (tour - 1) % 7;
            const indices = [0, 1, 2, 3, 4, 5, 6, 7];
            // Сдвигаем команды для каждого тура
            let rotated = [indices[0]];
            for(let i=1; i<indices.length; i++) {
                let idx = 1 + ((i - 1 + t) % 7);
                rotated.push(idx);
            }
            
            return [
                [rotated[0], rotated[7]],
                [rotated[1], rotated[6]],
                [rotated[2], rotated[5]],
                [rotated[3], rotated[4]]
            ];
        }

        // Система генерации голов с кастомными шансами (включая хет-трик ~7% шанс забить 3+ гола)
        function simulateGoals() {
            const rand = Math.random() * 100;
            if (rand < 32) return 0;       // 32% шанс 0 голов
            if (rand < 68) return 1;       // 36% шанс 1 гол
            if (rand < 88) return 2;       // 20% шанс 2 гола
            if (rand < 95) return 3;       // 7% шанс хет-трика (3 гола)
            return 4 + Math.floor(Math.random() * 2); // 5% шанс разгрома (4-5 голов)
        }

        // Инициализация при загрузке
        function initSeason() {
            resetSeasonData();
            updateUI();
        }

        function resetSeasonData() {
            currentMonthIndex = 0;
            seasonFinished = false;
            lastPlayedMatches = [];
            teams.forEach(team => {
                team.p = 0; team.w = 0; team.d = 0; team.l = 0;
                team.gf = 0; team.ga = 0; team.pts = 0;
            });
        }

        function resetSeason() {
            resetSeasonData();
            updateUI();
        }

        // Симуляция следующего тура (месяца)
        function nextTour() {
            if (seasonFinished) {
                alert("Сезон завершен! Нажмите «Сброс» для нового сезона.");
                return;
            }

            currentMonthIndex++;
            let tourNumber = currentMonthIndex;
            let pairings = getPairingsForTour(tourNumber);
            lastPlayedMatches = [];

            pairings.forEach(pair => {
                let teamA = teams.find(t => t.id === pair[0] + 1);
                let teamB = teams.find(t => t.id === pair[1] + 1);

                let goalsA = simulateGoals();
                let goalsB = simulateGoals();

                // Обновляем статистику команды A
                teamA.p += 1;
                teamA.gf += goalsA;
                teamA.ga += goalsB;

                // Обновляем статистику команды B
                teamB.p += 1;
                teamB.gf += goalsB;
                teamB.ga += goalsA;

                if (goalsA > goalsB) {
                    teamA.w += 1; teamA.pts += 3;
                    teamB.l += 1;
                } else if (goalsA < goalsB) {
                    teamB.w += 1; teamB.pts += 3;
                    teamA.l += 1;
                } else {
                    teamA.d += 1; teamA.pts += 1;
                    teamB.d += 1; teamB.pts += 1;
                }

                lastPlayedMatches.push({
                    home: teamA.name,
                    away: teamB.name,
                    scoreA: goalsA,
                    scoreB: goalsB,
                    isHattrick: (goalsA >= 3 || goalsB >= 3)
                });
            });

            if (currentMonthIndex >= 12) {
                seasonFinished = true;
            }

            updateUI();
        }

        // Рендеринг интерфейса
        function updateUI() {
            // Месяц и тур
            let activeMonthName = monthsList[currentMonthIndex % 12];
            document.getElementById('month-title').innerText = activeMonthName;
            document.getElementById('tour-num').innerText = currentMonthIndex === 0 ? "1 (Ожидание)" : currentMonthIndex;
            
            if (seasonFinished) {
                document.getElementById('current-status-text').innerText = "Сезон завершен 🏆";
                document.getElementById('next-btn').innerText = "Сезон окончен";
                document.getElementById('next-btn').classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                document.getElementById('current-status-text').innerText = `Месяц ${currentMonthIndex + 1} / 12`;
                document.getElementById('next-btn').innerText = currentMonthIndex === 0 ? "Начать сезон ➡️" : "Следующий месяц ➡️";
            }

            // Рендер матчей
            let matchesHTML = "";
            if (currentMonthIndex === 0) {
                matchesHTML = `<div class="text-center text-slate-500 py-12">Нажмите кнопку «Начать сезон», чтобы запустить первый месяц (Апрель) и сыграть матчи тура.</div>`;
            } else {
                lastPlayedMatches.forEach(match => {
                    let hattrickBadge = match.isHattrick ? `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse">🔥 ХЕТ-ТРИК</span>` : "";
                    matchesHTML += `
                        <div class="bg-slate-950/50 border border-slate-800/80 p-4 rounded-xl flex flex-col gap-2">
                            <div class="flex justify-between items-center text-sm">
                                <span class="font-medium text-slate-200 w-2/5 truncate">${match.home}</span>
                                <div class="bg-slate-800 px-3 py-1 rounded-lg font-bold text-emerald-400 tracking-wider">
                                    ${match.scoreA} : ${match.scoreB}
                                </div>
                                <span class="font-medium text-slate-200 w-2/5 truncate text-right">${match.away}</span>
                            </div>
                            ${hattrickBadge ? `<div class="flex justify-center">${hattrickBadge}</div>` : ""}
                        </div>
                    `;
                });
            }
            document.getElementById('matches-container').innerHTML = matchesHTML;

            // Сортировка таблицы: Очки -> Разница мячей -> Забитые голы
            let sortedTeams = [...teams].sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                let diffB = b.gf - b.ga;
                let diffA = a.gf - a.ga;
                if (diffB !== diffA) return diffB - diffA;
                return b.gf - a.gf;
            });

            // Рендер таблицы
            let tableHTML = "";
            sortedTeams.forEach((team, index) => {
                let rankStyle = index === 0 ? "text-amber-400 font-bold" : index < 3 ? "text-emerald-400 font-semibold" : "text-slate-300";
                let rowBg = index === 0 ? "bg-amber-500/5" : index % 2 === 0 ? "bg-slate-900/40" : "";
                
                tableHTML += `
                    <tr class="${rowBg} hover:bg-slate-800/40 transition-colors">
                        <td class="py-3 px-3 ${rankStyle}">${index + 1}</td>
                        <td class="py-3 px-3 font-medium text-white">${team.name}</td>
                        <td class="py-3 px-2 text-center text-slate-400">${team.p}</td>
                        <td class="py-3 px-2 text-center text-slate-300">${team.w}</td>
                        <td class="py-3 px-2 text-center text-slate-300">${team.d}</td>
                        <td class="py-3 px-2 text-center text-slate-300">${team.l}</td>
                        <td class="py-3 px-2 text-center text-slate-400">${team.gf}:${team.ga}</td>
                        <td class="py-3 px-2 text-center font-bold text-emerald-400">${team.pts}</td>
                    </tr>
                `;
            });
            document.getElementById('standings-body').innerHTML = tableHTML;
        }

        // Запуск при старте
        init();
        function init() {
            updateUI();
        }
    </script>
</body>
</html>
