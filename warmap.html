            --panel-card: #141a24;
            --panel-hover: #1c2433;
            --border-dark: #1b2230;
            --border-light: #2c364a;

            --accent-blue-glow: rgba(0, 168, 255, 0.35);
            --accent-red: #ff3f34;
            --accent-red-glow: rgba(255, 63, 52, 0.35);
            --accent-gold: #ffd32a;
            --accent-gold-glow: rgba(255, 211, 42, 0.35);
            --accent-green: #05c46b;
            --accent-purple: #ef5777;

            --text-primary: #f1f2f6;
            --text-secondary: #8a9ba8;
            --text-muted: #576574;

            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);

            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;

        /* ==========================================================================
           2. ШАПКА И СТАТУСНЫЕ ПАНЕЛИ
           ========================================================================== */
        header {
            height: 54px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-dark);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 14px;
            height: 14px;
            background: var(--accent-red);

            box-shadow: 0 0 10px var(--accent-red-glow);

        @keyframes pulse-red {

        .header-telemetry {

            font-size: 0.78rem;
        }

        .telemetry-item {

            align-items: flex-end;
        }

        .telemetry-label {
            color: var(--text-muted);
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .telemetry-value {
            color: var(--accent-blue);
            font-weight: 700;
        }

        .header-actions {

            align-items: center;
            gap: 10px;

            border: 1px solid var(--border-dark);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.75rem;

            transition: all 0.15s ease;
            display: flex;
            align-items: center;

        .btn-icon:hover {

            color: var(--text-primary);
            background: var(--panel-hover);
        }

        .btn-icon.active {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(255, 211, 42, 0.08);
        }

        /* ==========================================================================
           3. ОСНОВНОЙ РАБОЧИЙ МЕШОК (GRID LAYOUT)
           ========================================================================== */

            flex: 1;
            display: grid;
            grid-template-columns: 1fr 440px;
            gap: 10px;
            padding: 10px;
            min-height: 0;
            position: relative;
        }

        .viewport-container {

            border: 1px solid var(--border-dark);
            border-radius: 6px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;

            cursor: grab;
        }

        }

        canvas#mainMap {
            width: 100%;
            height: 100%;
            display: block;

            top: 12px;
            left: 12px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

            backdrop-filter: blur(8px);
            border: 1px solid var(--border-dark);
            padding: 8px 12px;
            border-radius: 4px;

            flex-direction: column;
            gap: 6px;

            color: var(--accent-blue);
            background: rgba(0, 168, 255, 0.12);

        .timeline-bar {

            background: var(--panel-bg);
            border-top: 1px solid var(--border-dark);
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;

        .play-pause-btn {

        .hidden {

           А. МОДУЛЬ ЗВУКОВОГО ДВИЖКА (WEB AUDIO API)
           ========================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.lastGunshotTime = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playGunshot() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                if (now - this.lastGunshotTime < 0.05) return;
                this.lastGunshotTime = now;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400 + Math.random() * 200, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.1);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.1);
            }

            playExplosion() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;

                const bufferSize = this.ctx.sampleRate * 0.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, now);
                filter.frequency.linearRampToValueAtTime(60, now + 0.5);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
            }

            playClick() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.05);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

            // КРАСНЫЕ
            {

                    { t: 0, x: 0.95, y: 0.30 },
                    { t: 50, x: 0.80, y: 0.35 },

            }
        ];

        /* ==========================================================================
           В. ЧАСТИЦЫ И ВИЗУАЛЬНЫЕ ЭФФЕКТЫ
           ========================================================================== */
        class Particle {
            constructor(x, y, color, speed, size, life, type = 'pixel') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.size = size;
                this.maxLife = life;
                this.life = life;
                this.type = type;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                
                if (this.type === 'pixel') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'tracer') {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
                    ctx.stroke();
                }
                
                ctx.restore();
            }
        }

        const particles = [];

        function spawnExplosion(x, y, color = '#ffd32a', count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 4, Math.random() * 3 + 1, 35));
            }
            sounds.playExplosion();
        }

        function spawnTracer(x1, y1, x2, y2, color = '#ffffff') {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const dist = Math.hypot(dx, dy);
            if (dist === 0) return;
            const speed = 15;
            const vx = (dx / dist) * speed;
            const vy = (dy / dist) * speed;
            
            const p = new Particle(x1, y1, color, 0, 1.5, 15, 'tracer');
            p.vx = vx;
            p.vy = vy;
            particles.push(p);
            
            if (Math.random() < 0.15) sounds.playGunshot();
        }

        /* ==========================================================================
           Г. КЛАСС АГЕНТАИ МОДЕЛИРОВАНИЕ
           ========================================================================== */
        class Agent {
            constructor(config) {
                this.id = config.id;
                this.name = config.name;
                this.team = config.team;
                this.rating = config.rating || 75;
                this.role = config.role || 'ПЕХОТА';
                this.isVip = config.isVip || false;
                this.zocRadius = config.zocRadius || 30;
                this.stats = config.stats || { kda: '1.0', damage: '5K', armor: '50', speed: '50' };
                this.path = config.path || [];

                this.x = 0;
                this.y = 0;
                this.hp = 100;
                this.status = 'В БОЮ';
            }

            updatePosition(progress) {
                if (!this.path || this.path.length === 0) return;

                let p1 = this.path[0];
                let p2 = this.path[this.path.length - 1];

                if (progress <= p1.t) {
                    this.x = p1.x;
                    this.y = p1.y;
                    return;
                }
                if (progress >= p2.t) {
                    this.x = p2.x;
                    this.y = p2.y;
                    return;
                }

                for (let i = 0; i < this.path.length - 1; i++) {
                    if (progress >= this.path[i].t && progress <= this.path[i + 1].t) {
                        p1 = this.path[i];
                        p2 = this.path[i + 1];
                        break;
                    }
                }

                const factor = (progress - p1.t) / (p2.t - p1.t);
                this.x = p1.x + (p2.x - p1.x) * factor;
                this.y = p1.y + (p2.y - p1.y) * factor;

                // Небольшие колебания HP в зависимости от прогресса
                this.hp = Math.max(15, Math.min(100, Math.floor(100 - Math.sin(progress * 0.1 + this.rating) * 30)));
            }
        }

        /* ==========================================================================
           Д. ИНИЦИАЛИЗАЦИЯ И УПРАВЛЕНИЕ СОСТОЯНИЕМ СИМУЛЯЦИИ
           ========================================================================== */
        const agents = [];
        let selectedAgent = null;

        // Создаем VIP Агентов
        VIP_DATABASE.forEach(data => {
            agents.push(new Agent({ ...data, isVip: true }));
        });

        // Генерируем массовку пехоты (Рядовые агенты)
        for (let i = 0; i < 110; i++) {
            const team = i % 2 === 0 ? 'blue' : 'red';
            const startX = team === 'blue' ? 0.05 + Math.random() * 0.25 : 0.70 + Math.random() * 0.25;
            const startY = 0.1 + Math.random() * 0.8;
            const endX = team === 'blue' ? startX + 0.3 + Math.random() * 0.2 : startX - 0.3 - Math.random() * 0.2;
            const endY = startY + (Math.random() - 0.5) * 0.3;

            agents.push(new Agent({
                id: `unit_${i}`,
                name: `Отряд ${team === 'blue' ? 'Альфа' : 'Омега'} #${i + 1}`,
                team: team,
                rating: 60 + Math.floor(Math.random() * 25),
                role: 'ПЕХОТА',
                isVip: false,
                zocRadius: 25 + Math.random() * 15,
                stats: { kda: '1.2', damage: '3K', armor: '40', speed: '60' },
                path: [
                    { t: 0, x: startX, y: startY },
                    { t: 50 + (Math.random() - 0.5) * 20, x: (startX + endX) / 2, y: (startY + endY) / 2 },
                    { t: 100, x: endX, y: endY }
                ]
            }));
        }

        // Переключатели слоев
        const activeLayers = {
            zoc: true,
            frontline: true,
            particles: true,
            grid: false
        };

        let isPlaying = false;
        let simProgress = 0; // 0..100
        let animFrameId = null;

        /* ==========================================================================
           Е. ХОЛСТ CANVAS, КАМЕРА И РЕНДЕРИНГ
           ========================================================================== */
        const canvas = document.getElementById('mainMap');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');

        let camera = { x: 0, y: 0, zoom: 1 };
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        function resizeCanvas() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function resetCamera() {
            camera.x = 0;
            camera.y = 0;
            camera.zoom = 1;
        }

        wrapper.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDragging = true;
                dragStart = { x: e.clientX - camera.x, y: e.clientY - camera.y };
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                camera.x = e.clientX - dragStart.x;
                camera.y = e.clientY - dragStart.y;
            }
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            camera.zoom = Math.max(0.5, Math.min(4, camera.zoom * zoomFactor));
        });

        // Выбор агента кликом по canvas
        wrapper.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let found = null;
            let minDist = Infinity;

            agents.forEach(agent => {
                const screenX = agent.x * canvas.width * camera.zoom + camera.x;
                const screenY = agent.y * canvas.height * camera.zoom + camera.y;
                const dist = Math.hypot(mouseX - screenX, mouseY - screenY);

                if (dist < 20 && dist < minDist) {
                    minDist = dist;
                    found = agent;
                }
            });

            if (found) {
                selectAgent(found);
                sounds.playClick();
            }
        });

        /* Главный цикл отрисовки */
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            const w = canvas.width;
            const h = canvas.height;

            // 1. Сетка
            if (activeLayers.grid) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                ctx.lineWidth = 1;
                const step = 40;
                for (let x = 0; x < w; x += step) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
                }
                for (let y = 0; y < h; y += step) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
                }
            }

            // Обновление позиций агентов
            agents.forEach(a => a.updatePosition(simProgress));

            // 2. Зоны ZOC
            if (activeLayers.zoc) {
                agents.forEach(a => {
                    if (!a.isVip) return;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(a.x * w, a.y * h, a.zocRadius, 0, Math.PI * 2);
                    ctx.fillStyle = a.team === 'blue' ? 'rgba(0, 168, 255, 0.08)' : 'rgba(255, 63, 52, 0.08)';
                    ctx.fill();
                    ctx.strokeStyle = a.team === 'blue' ? 'rgba(0, 168, 255, 0.25)' : 'rgba(255, 63, 52, 0.25)';
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.restore();
                });
            }

            // 3. Линия фронта (соединение передовых агентов)
            if (activeLayers.frontline) {
                const blueFront = agents.filter(a => a.team === 'blue').sort((a, b) => b.x - a.x).slice(0, 8);
                const redFront = agents.filter(a => a.team === 'red').sort((a, b) => a.x - b.x).slice(0, 8);

                ctx.save();
                ctx.strokeStyle = 'rgba(255, 211, 42, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < Math.min(blueFront.length, redFront.length); i++) {
                    const midX = (blueFront[i].x + redFront[i].x) / 2 * w;
                    const midY = (blueFront[i].y + redFront[i].y) / 2 * h;
                    if (i === 0) ctx.moveTo(midX, midY);
                    else ctx.lineTo(midX, midY);
                }
                ctx.stroke();
                ctx.restore();
            }

            // 4. Отрисовка стычек и спавн трассеров во время игры
            if (isPlaying && activeLayers.particles && Math.random() < 0.3) {
                const blueA = agents[Math.floor(Math.random() * agents.length)];
                const redA = agents[Math.floor(Math.random() * agents.length)];
                if (blueA.team !== redA.team) {
                    const dist = Math.hypot((blueA.x - redA.x) * w, (blueA.y - redA.y) * h);
                    if (dist < 200) {
                        spawnTracer(blueA.x * w, blueA.y * h, redA.x * w, redA.y * h, blueA.team === 'blue' ? '#00a8ff' : '#ff3f34');
                        if (Math.random() < 0.1) spawnExplosion(redA.x * w, redA.y * h, '#ffd32a', 8);
                    }
                }
            }

            // 5. Отрисовка Агентов
            agents.forEach(a => {
                const ax = a.x * w;
                const ay = a.y * h;

                ctx.save();
                ctx.beginPath();
                const radius = a.isVip ? 7 : 3.5;
                ctx.arc(ax, ay, radius, 0, Math.PI * 2);
                ctx.fillStyle = a.team === 'blue' ? '#00a8ff' : '#ff3f34';
                ctx.fill();

                if (a.isVip) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // Имя VIP
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px "JetBrains Mono"';
                    ctx.fillText(a.name, ax + 10, ay + 3);
                }

                if (selectedAgent === a) {
                    ctx.strokeStyle = '#ffd32a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(ax, ay, radius + 5, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            });

            // 6. Частицы
            if (activeLayers.particles) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw(ctx);
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
            }

            ctx.restore();

            if (isPlaying) {
                simProgress += 0.05;
                if (simProgress > 100) simProgress = 0;
                document.getElementById('timeSlider').value = simProgress;
                updateTimeDisplay();
            }

            animFrameId = requestAnimationFrame(render);
        }

        /* ==========================================================================
           Ж. ИНТЕРФЕЙС И ВЗАИМОДЕЙСТВИЕ (UI)
           ========================================================================== */
        const playBtn = document.getElementById('playBtn');
        const timeSlider = document.getElementById('timeSlider');
        const timeDisplay = document.getElementById('timeDisplay');

        playBtn.addEventListener('click', () => {
            sounds.init();
            isPlaying = !isPlaying;
            playBtn.innerText = isPlaying ? '⏸' : '▶';
            sounds.playClick();
        });

        timeSlider.addEventListener('input', (e) => {
            simProgress = parseFloat(e.target.value);
            updateTimeDisplay();
        });

        function updateTimeDisplay() {
            const totalSec = Math.floor((simProgress / 100) * 2700); // 45 минут
            const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
            const s = String(totalSec % 60).padStart(2, '0');
            timeDisplay.innerText = `${m}:${s} / 45:00`;

            // Фазы боя
            const phaseTitle = document.getElementById('phaseTitle');
            if (simProgress < 30) phaseTitle.innerText = 'ФАЗА 1: ПОЗИЦИОННЫЕ БОИ';
            else if (simProgress < 70) phaseTitle.innerText = 'ФАЗА 2: ВСТРЕЧНЫЙ КОНТАКТ И ПРОРЫВ';
            else phaseTitle.innerText = 'ФАЗА 3: ДЕБЛОКАДА И ЗАЧИСТКА';
        }

        // Переключение вкладок
        window.switchTab = function(tabId, btn) {
            sounds.playClick();
            document.querySelectorAll('.tab-viewport').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId).classList.remove('hidden');
            btn.classList.add('active');
        };

        // Генерация FIFA Карточек
        function generateFifaCards() {
            const blueContainer = document.getElementById('tab-blue');
            const redContainer = document.getElementById('tab-red');

            blueContainer.innerHTML = '';
            redContainer.innerHTML = '';

            agents.filter(a => a.isVip).forEach(agent => {
                const card = document.createElement('div');
                card.className = `fifa-card-v2 ${agent.team === 'blue' ? 'blue-side' : 'red-side'}`;
                card.onclick = () => { selectAgent(agent); sounds.playClick(); };

                card.innerHTML = `
                    <div class="fifa-badge">
                        <div class="fifa-score" style="color: ${agent.team === 'blue' ? 'var(--accent-blue)' : 'var(--accent-red)'}">${agent.rating}</div>
                        <div class="fifa-pos">${agent.role}</div>
                    </div>
                    <div class="fifa-body">
                        <div class="fifa-header-row">
                            <div class="fifa-name">${agent.name}</div>
                            <div class="fifa-status-tag">${agent.status}</div>
                        </div>
                        <div class="fifa-stats-grid">
                            <div class="stat-item"><span class="stat-lbl">KDA</span><span class="stat-val">${agent.stats.kda}</span></div>
                            <div class="stat-item"><span class="stat-lbl">DMG</span><span class="stat-val">${agent.stats.damage}</span></div>
                            <div class="stat-item"><span class="stat-lbl">ARM</span><span class="stat-val">${agent.stats.armor}</span></div>
                        </div>
                    </div>
                    <div class="fifa-hp-bar" style="width: ${agent.hp}%"></div>
                `;

                if (agent.team === 'blue') blueContainer.appendChild(card);
                else redContainer.appendChild(card);
            });
        }

        function selectAgent(agent) {
            selectedAgent = agent;
            const inspector = document.getElementById('inspectorContent');
            inspector.innerHTML = `
                <div style="border-bottom: 1px solid var(--border-dark); padding-bottom: 8px;">
                    <h3 style="color: var(--accent-gold); font-size: 1rem;">${agent.name}</h3>
                    <div style="color: var(--text-muted); font-size: 0.7rem;">ID: ${agent.id} | КОМАНДА: ${agent.team.toUpperCase()}</div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
                    <div>БОЕВОЙ РЕЙТИНГ: <strong>${agent.rating}</strong></div>
                    <div>РОЛЬ: <strong>${agent.role}</strong></div>
                    <div>ЗДОРОВЬЕ (HP): <strong style="color: var(--accent-green)">${agent.hp}%</strong></div>
                    <div>РАДИУС ZOC: <strong>${agent.zocRadius}m</strong></div>
                </div>
            `;
            // Переключаем на вкладку инспектора
            switchTab('tab-inspector', document.querySelectorAll('.tab-btn')[2]);
        }

        // Переключатели слоев
        document.querySelectorAll('.toggle-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                sounds.playClick();
                const layer = chip.getAttribute('data-layer');
                activeLayers[layer] = !activeLayers[layer];
                chip.classList.toggle('active', activeLayers[layer]);
            });
        });

        // Кнопки шапки
        document.getElementById('soundToggleBtn').addEventListener('click', function() {
            sounds.enabled = !sounds.enabled;
            this.classList.toggle('active', sounds.enabled);
            this.innerHTML = `<span>🔊</span> ЗВУК: ${sounds.enabled ? 'ВКЛ' : 'ВЫКЛ'}`;
        });

        document.getElementById('resetCamBtn').addEventListener('click', () => {
            sounds.playClick();
            resetCamera();
        });

        // Логи боя
        function initLogs() {
            const list = document.getElementById('battleLogList');
            const events = [
                '00:02 - Развертывание подразделений на рубежах ZOC',
                '05:14 - Соприкосновение разведгрупп в центральном секторе',
                '12:40 - Артиллерийский налет по позициям фланга',
                '22:15 - Встречный танковый бой на линии фронта',
                '35:50 - Попытка глубокого обхода и зачистка сектора'
            ];
            events.forEach(evt => {
                const item = document.createElement('div');
                item.className = 'log-entry';
                item.innerHTML = `<span class="time">${evt.slice(0, 5)}</span> ${evt.slice(8)}`;
                list.appendChild(item);
            });
        }

        // Запуск
        generateFifaCards();
        initLogs();
        render();
    </script>
</body>
