    <script>
        /* ==========================================================================
            А. МОДУЛЬ ЗВУКОВОГО ДВИЖКА (WEB AUDIO API)
            ========================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.lastGunshotTime = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playGunshot() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                if (now - this.lastGunshotTime < 0.05) return;
                this.lastGunshotTime = now;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400 + Math.random() * 200, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.1);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.1);
            }

            playExplosion() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;

                const bufferSize = this.ctx.sampleRate * 0.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, now);
                filter.frequency.linearRampToValueAtTime(60, now + 0.5);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
            }

            playClick() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.05);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        /* ==========================================================================
            В. ЧАСТИЦЫ И ВИЗУАЛЬНЫЕ ЭФФЕКТЫ (PARTICLE SYSTEM)
            ========================================================================== */
        class Particle {
            constructor(x, y, color, speed, size, life, type = 'pixel') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.size = size;
                this.maxLife = life;
                this.life = life;
                this.type = type;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                
                if (this.type === 'pixel') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'tracer') {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
                    ctx.stroke();
                }
                
                ctx.restore();
            }
        }

        const particles = [];

        function spawnExplosion(x, y, color = '#ffd32a', count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 4, Math.random() * 3 + 1, 35));
            }
            sounds.playExplosion();
        }

        function spawnTracer(x1, y1, x2, y2, color = '#ffffff') {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const dist = Math.hypot(dx, dy);
            if (dist === 0) return;
            const speed = 15;
            const vx = (dx / dist) * speed;
            const vy = (dy / dist) * speed;
            
            particles.push(new Particle(x1, y1, color, 0, 1.5, 15, 'tracer'));
            particles[particles.length-1].vx = vx;
            particles[particles.length-1].vy = vy;
            
            if (Math.random() < 0.2) sounds.playGunshot();
        }

        /* ==========================================================================
            Г. КЛАСС АГЕНТА И АГЕНТНАЯ ФИЗИКА
            ========================================================================== */
        class Agent {
            constructor(config) {
                this.id = config.id;
                this.name = config.name;
                this.team = config.team;
                this.rating = config.rating || 75;
                this.role = config.role || 'ПЕХОТА';
                this.isVip = config.isVip || false;
                this.zocRadius = config.zocRadius || 75;
                this.stats = config.stats || { kda: '1.0', damage: '1K', armor: '50', speed: '50' };
                this.path = config.path || [];
                this.hp = 100;
                this.maxHp = 100;
                this.x = 0;
                this.y = 0;
            }

            update(progress) {
                if (this.path.length === 0) return;
                
                let p1 = this.path[0];
                let p2 = this.path[this.path.length - 1];
                
                for (let i = 0; i < this.path.length - 1; i++) {
                    if (progress >= this.path[i].t && progress <= this.path[i+1].t) {
                        p1 = this.path[i];
                        p2 = this.path[i+1];
                        break;
                    } else if (progress > this.path[this.path.length - 1].t) {
                        p1 = this.path[this.path.length - 1];
                        p2 = p1;
                    }
                }
                
                const span = p2.t - p1.t;
                const factor = span === 0 ? 0 : (progress - p1.t) / span;
                
                const canvasEl = document.getElementById('mainMap');
                const targetPixelX = p1.x + (p2.x - p1.x) * factor;
                const targetPixelY = p1.y + (p2.y - p1.y) * factor;
                
                this.x += (targetPixelX * canvasEl.width - this.x) * 0.1;
                this.y += (targetPixelY * canvasEl.height - this.y) * 0.1;
            }

            draw(ctx) {
                ctx.save();
                const isBlue = this.team === 'blue';
                const color = isBlue ? '#00a8ff' : '#ff3f34';
                
                if (activeLayers.zoc) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.zocRadius, 0, Math.PI * 2);
                    ctx.fillStyle = isBlue ? 'rgba(0, 168, 255, 0.05)' : 'rgba(255, 63, 52, 0.05)';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = isBlue ? 'rgba(0, 168, 255, 0.2)' : 'rgba(255, 63, 52, 0.2)';
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
                
                ctx.fillStyle = '#f1f2f6';
                ctx.font = '10px JetBrains Mono';
                ctx.fillText(this.name, this.x + 12, this.y + 4);
                
                ctx.restore();
            }
        }

        const agents = VIP_DATABASE.map(cfg => new Agent(cfg));
        let selectedAgent = null;

        const activeLayers = {
            zoc: true,
            frontline: true,
            particles: true,
            grid: false
        };

        const canvasEl = document.getElementById('mainMap');
        const ctx = canvasEl.getContext('2d');
        
        function resizeCanvas() {
            const wrapper = document.getElementById('canvasWrapper');
            canvasEl.width = wrapper.clientWidth;
            canvasEl.height = wrapper.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.querySelectorAll('.toggle-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
                const layer = btn.getAttribute('data-layer');
                activeLayers[layer] = btn.classList.contains('active');
                sounds.playClick();
            });
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-viewport').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            sounds.playClick();
        }

        function populateCards() {
            const blueContainer = document.getElementById('tab-blue');
            const redContainer = document.getElementById('tab-red');
            
            blueContainer.innerHTML = '';
            redContainer.innerHTML = '';
            
            VIP_DATABASE.forEach(hero => {
                const card = document.createElement('div');
                card.className = `fifa-card-v2 ${hero.team === 'blue' ? 'blue-side' : 'red-side'}`;
                card.innerHTML = `
                    <div class="fifa-badge">
                        <div class="fifa-score">${hero.rating}</div>
                        <div class="fifa-pos">${hero.role}</div>
                    </div>
                    <div class="fifa-body">
                        <div class="fifa-header-row">
                            <span class="fifa-name">${hero.name}</span>
                            <span class="fifa-status-tag">${hero.team.toUpperCase()}</span>
                        </div>
                        <div class="fifa-stats-grid">
                            <div class="stat-item"><span class="stat-lbl">KDA:</span><span class="stat-val">${hero.stats.kda}</span></div>
                            <div class="stat-item"><span class="stat-lbl">DMG:</span><span class="stat-val">${hero.stats.damage}</span></div>
                            <div class="stat-item"><span class="stat-lbl">ARM:</span><span class="stat-val">${hero.stats.armor}</span></div>
                        </div>
                    </div>
                    <div class="fifa-hp-bar" style="width: 100%;"></div>
                `;
                
                card.addEventListener('click', () => {
                    document.querySelectorAll('.fifa-card-v2').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedAgent = agents.find(a => a.id === hero.id);
                    updateInspector(hero);
                    sounds.playClick();
                });
                
                if (hero.team === 'blue') {
                    blueContainer.appendChild(card);
                } else {
                    redContainer.appendChild(card);
                }
            });
        }
        populateCards();

        function updateInspector(hero) {
            const inspector = document.getElementById('inspectorContent');
            inspector.innerHTML = `
                <div style="font-weight: 700; color: var(--accent-gold); font-size: 0.9rem; margin-bottom: 4px;">${hero.name}</div>
                <div style="color: var(--text-muted); margin-bottom: 10px;">Статус: В БОЮ // РОЛЬ: ${hero.role}</div>
                <div class="chart-box">
                    <canvas id="telemetryChart"></canvas>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 8px;">
                    <div>Рейтинг карточки: <b>${hero.rating}</b></div>
                    <div>Радиус ZOC: <b>${hero.zocRadius}м</b></div>
                    <div>Нанесенный урон: <b>${hero.stats.damage}</b></div>
                    <div>Бронезащита: <b>${hero.stats.armor}</b></div>
                </div>
            `;
        }

        let isPlaying = false;
        let simulationProgress = 0;
        const totalDuration = 45 * 60;

        const playBtn = document.getElementById('playBtn');
        const timeSlider = document.getElementById('timeSlider');
        const timeDisplay = document.getElementById('timeDisplay');

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? '❚❚' : '▶';
            sounds.init();
            sounds.playClick();
        });

        timeSlider.addEventListener('input', (e) => {
            simulationProgress = parseFloat(e.target.value);
            updateTimeDisplay();
        });

        function updateTimeDisplay() {
            const currentSeconds = (simulationProgress / 100) * totalDuration;
            const mins = Math.floor(currentSeconds / 60).toString().padStart(2, '0');
            const secs = Math.floor(currentSeconds % 60).toString().padStart(2, '0');
            timeDisplay.textContent = `${mins}:${secs} / 45:00`;
        }

        const logList = document.getElementById('battleLogList');
        const dummyLogs = [
            "00:00 Симуляция 'Контактный Бой V6.0' инициализирована.",
            "02:15 Синие силы выдвигаются на рубеж развертывания.",
            "08:30 Зафиксирована активность артиллерии в секторе Папича.",
            "15:42 Красный клин под командованием Shadowraze пробивает оборону.",
            "22:10 Котел в центральном секторе: окружение ключевых юнитов.",
            "31:00 Начата операция по деблокаде ключевых высот.",
            "40:15 Финальный этап штурма укреплений противника."
        ];
        dummyLogs.forEach(log => {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="time">[${log.substring(0, 5)}]</span>${log.substring(6)}`;
            logList.appendChild(entry);
        });

        let lastTime = performance.now();
        function loop(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            if (isPlaying) {
                simulationProgress += dt * 0.5;
                if (simulationProgress > 100) {
                    simulationProgress = 0;
                }
                timeSlider.value = simulationProgress;
                updateTimeDisplay();
            }

            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

            if (activeLayers.grid) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 1;
                const step = 40;
                for (let x = 0; x < canvasEl.width; x += step) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvasEl.height);
                    ctx.stroke();
                }
                for (let y = 0; y < canvasEl.height; y += step) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvasEl.width, y);
                    ctx.stroke();
                }
            }

            if (activeLayers.frontline) {
                ctx.beginPath();
                ctx.moveTo(canvasEl.width * 0.45, 0);
                ctx.bezierCurveTo(
                    canvasEl.width * 0.55, canvasEl.height * 0.3,
                    canvasEl.width * 0.35, canvasEl.height * 0.7,
                    canvasEl.width * 0.5, canvasEl.height
                );
                ctx.strokeStyle = 'rgba(255, 211, 42, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            agents.forEach(agent => {
                agent.update(simulationProgress);
                agent.draw(ctx);
            });

            if (activeLayers.particles) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    p.draw(ctx);
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    }
                }
                if (isPlaying && Math.random() < 0.3) {
                    const a1 = agents[Math.floor(Math.random() * agents.length)];
                    const a2 = agents[Math.floor(Math.random() * agents.length)];
                    if (a1 && a2 && a1 !== a2) {
                        spawnTracer(a1.x, a1.y, a2.x, a2.y, a1.team === 'blue' ? '#00a8ff' : '#ff3f34');
                    }
                }
            }

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
