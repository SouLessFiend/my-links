           1. ДИЗАЙН-СИСТЕМА И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
           ========================================================================== */

            --bg-main: #06080c;
            --panel-bg: #0d1117;
            --panel-card: #141a24;
            --panel-hover: #1c2433;
            --border-dark: #1b2230;
            --border-light: #2c364a;
            
            --accent-blue: #00a8ff;
            --accent-blue-glow: rgba(0, 168, 255, 0.35);
            --accent-red: #ff3f34;
            --accent-red-glow: rgba(255, 63, 52, 0.35);
            --accent-gold: #ffd32a;
            --accent-gold-glow: rgba(255, 211, 42, 0.35);
            --accent-green: #05c46b;
            --accent-purple: #ef5777;

            --text-primary: #f1f2f6;
            --text-secondary: #8a9ba8;
            --text-muted: #576574;

            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           2. ШАПКА И СТАТУСНЫЕ ПАНЕЛИ
           ========================================================================== */
        header {
            height: 54px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-dark);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 14px;
            height: 14px;
            background: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-red-glow);
            animation: pulse-red 1.5s infinite alternate;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .brand-title {
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            color: var(--text-primary);
        }

        .brand-title span {
            color: var(--accent-gold);
        }

        .header-telemetry {
            display: flex;
            align-items: center;
            gap: 24px;
            font-family: var(--font-mono);
            font-size: 0.78rem;
        }

        .telemetry-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .telemetry-label {
            color: var(--text-muted);
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .telemetry-value {
            color: var(--accent-blue);
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            background: var(--panel-card);
            border: 1px solid var(--border-dark);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon:hover {
            border-color: var(--border-light);
            color: var(--text-primary);
            background: var(--panel-hover);
        }

        .btn-icon.active {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(255, 211, 42, 0.08);
        }

        /* ==========================================================================
           3. ОСНОВНОЙ РАБОЧИЙ МЕШОК (GRID LAYOUT)
           ========================================================================== */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 440px;
            gap: 10px;
            padding: 10px;
            min-height: 0;
            position: relative;
        }

        /* Левая часть: Карта + Оверлей HUD */

            border: 1px solid var(--border-dark);
            border-radius: 6px;

            display: flex;
            flex-direction: column;
            overflow: hidden;

            position: relative;
            cursor: grab;
        }

        .canvas-wrapper:active {

        }

        canvas#mainMap {
            width: 100%;
            height: 100%;
            display: block;
        }

            top: 12px;
            left: 12px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;

            backdrop-filter: blur(8px);
            border: 1px solid var(--border-dark);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.72rem;

            right: 12px;

            flex-direction: column;
            gap: 6px;
            pointer-events: auto;

            transition: all 0.15s ease;

        .toggle-chip.active {

            color: var(--accent-blue);
            background: rgba(0, 168, 255, 0.12);
        }

        /* Нижний таймлайн управления кадрами */

            background: var(--panel-bg);
            border-top: 1px solid var(--border-dark);

            border-radius: 4px;

            font-size: 0.9rem;

        }

        .slider-container {

            display: flex;
            flex-direction: column;

            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);

        .hidden {

    <script>
        /* ==========================================================================
           А. МОДУЛЬ ЗВУКОВОГО ДВИЖКА (WEB AUDIO API)
           ========================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playGunshot() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                
                // Осциллятор для импульса выстрела
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.15);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
            }

            playExplosion() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;

                // Белый шум для глухого разрыва
                const bufferSize = this.ctx.sampleRate * 0.4;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.linearRampToValueAtTime(50, now + 0.4);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
            }

            playClick() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.04);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.04);
            }
        }

        /* ==========================================================================
           В. ЧАСТИЦЫ И ВИЗУАЛЬНЫЕ ЭФФЕКТЫ (PARTICLE SYSTEM)
           ========================================================================== */
        class Particle {
            constructor(x, y, color, speed, size, life) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.size = size;
                this.maxLife = life;
                this.life = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        const particles = [];

        function spawnExplosion(x, y, color = '#ffd32a', count = 15) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 3, Math.random() * 3 + 1, 30));
            }
            sounds.playExplosion();
        }

        /* ==========================================================================
           Г. КЛАСС АГЕНТА И АГЕНТНАЯ ФИЗИКА (STEERING BEHAVIORS)
           ========================================================================== */
        class Agent {
            constructor(config) {
                this.id = config.id;
                this.name = config.name;
                this.team = config.team;
                this.rating = config.rating || 75;
                this.role = config.role || 'ПЕХОТА';
                this.isVip = config.isVip || false;
                this.zocRadius = config.zocRadius || 30;
                this.stats = config.stats || {};
                this.path = config.path || [];

                this.x = 0;
                this.y = 0;
                this.vx = 0;
                this.vy = 0;
                this.hp = 100;
                this.maxHp = 100;
                this.status = 'В БОЮ';
            }

            // Вычисление координат на основе ключевых кадров
            updatePosition(timePercent) {
                if (this.path.length === 0) return;

                const p = this.path;
                if (timePercent <= p[0].t) {
                    this.x = p[0].x;
                    this.y = p[0].y;
                    return;
                }
                if (timePercent >= p[p.length - 1].t) {
                    this.x = p[p.length - 1].x;
                    this.y = p[p.length - 1].y;
                    return;
                }

                for (let i = 0; i < p.length - 1; i++) {
                    if (timePercent >= p[i].t && timePercent <= p[i + 1].t) {
                        const factor = (timePercent - p[i].t) / (p[i + 1].t - p[i].t);
                        this.x = p[i].x + (p[i + 1].x - p[i].x) * factor;
                        this.y = p[i].y + (p[i + 1].y - p[i].y) * factor;
                        break;
                    }
                }

                // Логика состояния HP и статусов
                if (this.team === 'blue' && timePercent >= 35 && timePercent <= 60 && (this.id === 'souless' || this.id === 'diana')) {
                    this.status = 'В ОКРУЖЕНИИ';
                    this.hp = 45;
                } else if (this.team === 'red' && timePercent >= 85 && (this.id === 'bandera' || this.id === 'shadowraze')) {
                    this.status = 'РАЗГРОМЛЕН';
                    this.hp = 0;
                } else {
                    this.status = 'В БОЮ';
                    this.hp = 100;
                }
            }
        }

        /* ==========================================================================
           Д. ГЕНЕРАЦИЯ ВСЕХ 120 АГЕНТОВ ДЛЯ МАССОВКИ
           ========================================================================== */
        const allAgents = [];

        function initSimulationAgents() {
            allAgents.length = 0;

            // 1. Загружаем VIP
            VIP_DATABASE.forEach(v => {
                allAgents.push(new Agent({ ...v, isVip: true }));
            });

            // 2. Генерируем 110 рядовых юнитов
            for (let i = 0; i < 110; i++) {
                const team = i % 2 === 0 ? 'blue' : 'red';
                const startX = team === 'blue' ? 0.05 + Math.random() * 0.20 : 0.75 + Math.random() * 0.20;
                const startY = 0.05 + Math.random() * 0.90;

                const midX = startX + (team === 'blue' ? 0.25 : -0.25);
                const endX = midX + (team === 'blue' ? 0.30 : -0.30);

                allAgents.push(new Agent({
                    id: `grunt_${i}`,
                    name: `${team === 'blue' ? 'Б-Отряд' : 'К-Отряд'} #${i}`,
                    team: team,
                    isVip: false,
                    zocRadius: 20 + Math.random() * 15,
                    path: [
                        { t: 0, x: startX, y: startY },
                        { t: 40 + Math.random() * 20, x: midX, y: startY + (Math.random() - 0.5) * 0.1 },
                        { t: 100, x: endX, y: startY + (Math.random() - 0.5) * 0.2 }
                    ]
                }));
            }
        }

        /* ==========================================================================
           Е. РЕНДЕР КАРТЫ И ПОЛЕЙ ВЛИЯНИЯ ZOC (MAIN CANVAS RENDERER)
           ========================================================================== */
        const canvas = document.getElementById('mainMap');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');

        let camera = { x: 0, y: 0, zoom: 1, isDragging: false, dragStart: { x: 0, y: 0 } };
        let activeLayers = { zoc: true, particles: true, grid: true, vectors: true };
        let selectedAgentId = null;

        function resizeCanvas() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);

        function renderScene(progressTime) {
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            ctx.save();
            // Трансформация камеры
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            // 1. Отрисовка темной топографической сетки
            if (activeLayers.grid) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 1;
                const gridSize = 40;
                for (let x = 0; x < w * 2; x += gridSize) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h * 2); ctx.stroke();
                }
                for (let y = 0; y < h * 2; y += gridSize) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w * 2, y); ctx.stroke();
                }
            }

            // 2. Обновление позиций агентов
            allAgents.forEach(a => a.updatePosition(progressTime));

            // 3. Расчет и отрисовка ZOC Полей (Сетка Влияния)
            if (activeLayers.zoc) {
                const cols = 60;
                const rows = 40;
                const cellW = w / cols;
                const cellH = h / rows;

                for (let c = 0; c < cols; c++) {
                    for (let r = 0; r < rows; r++) {
                        const cx = (c + 0.5) * cellW;
                        const cy = (r + 0.5) * cellH;

                        let blueScore = 0;
                        let redScore = 0;

                        allAgents.forEach(a => {
                            if (a.hp <= 0) return;
                            const ax = a.x * w;
                            const ay = a.y * h;
                            const distSq = (cx - ax) * (cx - ax) + (cy - ay) * (cy - ay);
                            const rSq = a.zocRadius * a.zocRadius;

                            if (distSq < rSq) {
                                const wFactor = (1 - distSq / rSq);
                                if (a.team === 'blue') blueScore += wFactor;
                                else redScore += wFactor;
                            }
                        });

                        if (blueScore > 0 || redScore > 0) {
                            if (blueScore > redScore * 1.15) {
                                ctx.fillStyle = `rgba(0, 168, 255, ${Math.min(0.28, blueScore * 0.12)})`;
                                ctx.fillRect(c * cellW, r * cellH, cellW + 0.5, cellH + 0.5);
                            } else if (redScore > blueScore * 1.15) {
                                ctx.fillStyle = `rgba(255, 63, 52, ${Math.min(0.28, redScore * 0.12)})`;
                                ctx.fillRect(c * cellW, r * cellH, cellW + 0.5, cellH + 0.5);
                            } else {
                                // Зона огневого контакта
                                ctx.fillStyle = 'rgba(255, 211, 42, 0.22)';
                                ctx.fillRect(c * cellW, r * cellH, cellW + 0.5, cellH + 0.5);
                            }
                        }
                    }
                }
            }

            // 4. Отрисовка Частиц
            if (activeLayers.particles) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw(ctx);
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
            }

            // 5. Отрисовка Агентов
            allAgents.forEach(a => {
                if (a.hp <= 0) return; // Разгромленные не отображаются или горят

                const ax = a.x * w;
                const ay = a.y * h;
                const color = a.team === 'blue' ? '#00a8ff' : '#ff3f34';

                // Вектор направления
                if (activeLayers.vectors && a.isVip) {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(ax, ay);
                    ctx.lineTo(ax + 15, ay);
                    ctx.stroke();
                }

                // Форма юнита
                ctx.beginPath();
                if (a.isVip) {
                    ctx.arc(ax, ay, 7, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd32a';
                    ctx.fill();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Подпись имени VIP
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px JetBrains Mono';
                    ctx.fillText(a.name, ax + 10, ay + 4);
                } else {
                    ctx.arc(ax, ay, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.7;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }

                // Выделенный юнит
                if (a.id === selectedAgentId) {
                    ctx.beginPath();
                    ctx.arc(ax, ay, a.zocRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ffd32a';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            });

            ctx.restore();
        }

        /* ==========================================================================
           Ж. УПРАВЛЕНИЕ КАМЕРОЙ (ZOOM / PAN)
           ========================================================================== */
        wrapper.addEventListener('mousedown', (e) => {
            camera.isDragging = true;
            camera.dragStart = { x: e.clientX - camera.x, y: e.clientY - camera.y };
        });

        window.addEventListener('mousemove', (e) => {
            if (camera.isDragging) {
                camera.x = e.clientX - camera.dragStart.x;
                camera.y = e.clientY - camera.dragStart.y;
            }
        });

        window.addEventListener('mouseup', () => {
            camera.isDragging = false;
        });

        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            camera.zoom = Math.max(0.5, Math.min(3.0, camera.zoom * zoomFactor));
        });

        document.getElementById('resetCamBtn').addEventListener('click', () => {
            camera = { x: 0, y: 0, zoom: 1, isDragging: false, dragStart: { x: 0, y: 0 } };
            sounds.playClick();
        });

        /* ==========================================================================
           З. ИНТЕРФЕЙС FIFA КАРТОЧЕК И РЕНДЕР В ВКТЛАДКИ
           ========================================================================== */
        function renderFifaCards() {
            const blueContainer = document.getElementById('tab-blue');
            const redContainer = document.getElementById('tab-red');

            blueContainer.innerHTML = '';
            redContainer.innerHTML = '';

            allAgents.filter(a => a.isVip).forEach(a => {
                const card = document.createElement('div');
                card.className = `fifa-card-v2 ${a.team}-side ${a.id === selectedAgentId ? 'selected' : ''}`;
                card.onclick = () => selectAgent(a.id);

                card.innerHTML = `
                    <div class="fifa-badge">
                        <div class="fifa-score" style="color: ${a.team === 'blue' ? 'var(--accent-blue)' : 'var(--accent-red)'}">${a.rating}</div>
                        <div class="fifa-pos">${a.role}</div>
                    </div>
                    <div class="fifa-body">
                        <div class="fifa-header-row">
                            <span class="fifa-name">${a.name}</span>
                            <span class="fifa-status-tag" id="status-tag-${a.id}">${a.status}</span>
                        </div>
                        <div class="fifa-stats-grid">
                            <div class="stat-item"><span class="stat-lbl">У/С:</span><span class="stat-val">${a.stats.kda || '1.0'}</span></div>
                            <div class="stat-item"><span class="stat-lbl">УРН:</span><span class="stat-val">${a.stats.damage || '10K'}</span></div>
                            <div class="stat-item"><span class="stat-lbl">БРН:</span><span class="stat-val">${a.stats.armor || '50'}</span></div>
                        </div>
                    </div>
                    <div class="fifa-hp-bar" id="hp-bar-${a.id}" style="width: ${a.hp}%;"></div>
                `;

                if (a.team === 'blue') blueContainer.appendChild(card);
                else redContainer.appendChild(card);
            });
        }

        function selectAgent(id) {
            selectedAgentId = id;
            sounds.playClick();
            renderFifaCards();
            updateInspector();
            switchTab('tab-inspector', document.querySelectorAll('.tab-btn')[2]);
        }

        function updateInspector() {
            const container = document.getElementById('inspectorContent');
            const agent = allAgents.find(a => a.id === selectedAgentId);

            if (!agent) return;

            container.innerHTML = `
                <div style="background: var(--panel-card); padding: 12px; border-radius: 4px; border: 1px solid var(--border-light);">
                    <div style="color: var(--accent-gold); font-weight: 800; font-size: 1.1rem;">${agent.name}</div>
                    <div style="color: var(--text-muted); margin-bottom: 8px;">ПОЗИЦИЯ: ${agent.role} // КОМАНДА: ${agent.team.toUpperCase()}</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                        <div>РЕЙТИНГ: <b>${agent.rating}</b></div>
                        <div>ZOC РАДИУС: <b>${agent.zocRadius}px</b></div>
                        <div>ЗДОРОВЬЕ: <b style="color:var(--accent-green)">${agent.hp}%</b></div>
                        <div>СТАТУС: <b>${agent.status}</b></div>
                    </div>
                </div>
                <div class="chart-box">
                    <div style="font-size:0.65rem; color:var(--text-muted); margin-bottom:4px;">ДИНАМИКА ЭФФЕКТИВНОСТИ (DPS / SEC)</div>
                    <canvas id="telemetryChart"></canvas>
                </div>
            `;

            drawTelemetryChart();
        }

        function drawTelemetryChart() {
            const chartCanvas = document.getElementById('telemetryChart');
            if (!chartCanvas) return;
            const cCtx = chartCanvas.getContext('2d');
            cCtx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);

            cCtx.strokeStyle = '#00a8ff';
            cCtx.lineWidth = 2;
            cCtx.beginPath();
            cCtx.moveTo(0, 50);
            for (let x = 0; x < chartCanvas.width; x += 10) {
                cCtx.lineTo(x, 30 + Math.sin(x * 0.1) * 20 + Math.random() * 5);
            }
            cCtx.stroke();
        }

        /* ==========================================================================
           И. ТАЙМЛАЙН, КНОПКИ И ГЛАВНЫЙ ЦИКЛ (MAIN LOOP)
           ========================================================================== */
        const slider = document.getElementById('timeSlider');
        const playBtn = document.getElementById('playBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const phaseTitle = document.getElementById('phaseTitle');

        let isPlaying = false;
        let loopTimer = null;

        slider.addEventListener('input', () => {
            const val = parseFloat(slider.value);
            const mins = Math.floor((val / 100) * 45);
            timeDisplay.innerText = `${mins < 10 ? '0' : ''}${mins}:00 / 45:00`;

            // Фазы боя
            if (val < 30) {
                phaseTitle.innerText = "ФАЗА 1: ПОЗИЦИОННАЯ РАЗВЕДКА И АРТ-ДУЭЛИ";
            } else if (val < 65) {
                phaseTitle.innerText = "ФАЗА 2: ЦЕНТРАЛЬНЫЙ ПРОРЫВ И ОБРАЗОВАНИЕ КОТЛА";
                if (Math.random() < 0.05) spawnExplosion(canvas.width * 0.4, canvas.height * 0.5);
            } else {
                phaseTitle.innerText = "ФАЗА 3: ГЕНЕРАЛЬНЫЙ КОНТРУДАР И РАЗГРОМ ФЛАНГОВ";
            }

            // Обновление статусов в карточках
            allAgents.filter(a => a.isVip).forEach(a => {
                const tag = document.getElementById(`status-tag-${a.id}`);
                const hpBar = document.getElementById(`hp-bar-${a.id}`);
                if (tag) tag.innerText = a.status;
                if (hpBar) hpBar.style.width = `${a.hp}%`;
            });

            renderScene(val);
        });

        playBtn.addEventListener('click', () => {
            sounds.init();
            isPlaying = !isPlaying;
            playBtn.innerText = isPlaying ? '❚❚' : '▶';
            sounds.playClick();

            if (isPlaying) {
                loopTimer = setInterval(() => {
                    let curr = parseFloat(slider.value);
                    if (curr >= 100) curr = 0;
                    slider.value = curr + 0.2;
                    slider.dispatchEvent(new Event('input'));
                }, 30);
            } else {
                clearInterval(loopTimer);
            }
        });

        // Переключение вкладок
        window.switchTab = function(tabId, btn) {
            document.querySelectorAll('.tab-viewport').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            btn.classList.add('active');
            sounds.playClick();
        };

        // Слои карты
        document.querySelectorAll('.toggle-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const layer = chip.dataset.layer;
                chip.classList.toggle('active');
                activeLayers[layer] = chip.classList.contains('active');
                sounds.playClick();
            });
        });

        // Звук Toggle
        document.getElementById('soundToggleBtn').addEventListener('click', function() {
            sounds.enabled = !sounds.enabled;
            this.innerText = sounds.enabled ? '🔊 ЗВУК: ВКЛ' : '🔇 ЗВУК: ВЫКЛ';
        });

        // ИНИЦИАЛИЗАЦИЯ
        initSimulationAgents();
        renderFifaCards();
        setTimeout(() => {
            resizeCanvas();
            slider.dispatchEvent(new Event('input'));
        }, 150);

    </script>
