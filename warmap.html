<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТАКТИЧЕСКАЯ КАРТА: Котлы, Техника и Маневры</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: #12161f;
            --border-color: #232a3b;
            --accent-blue: #00a8ff;
            --accent-red: #ff3f34;
            --accent-gold: #ffd32a;
            --text-main: #f1f2f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }
        .status-badge {
            background: rgba(255, 63, 52, 0.15);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            padding: 20px;
            flex-grow: 1;
        }

        .map-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .canvas-container {
            flex-grow: 1;
            position: relative;
            background: #142213;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .timeline-controls {
            background: rgba(18, 22, 31, 0.98);
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .play-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-weight: 800;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            transition: 0.2s;
        }
        .play-btn:hover { opacity: 0.9; transform: scale(1.02); }
        .slider {
            flex-grow: 1;
            accent-color: var(--accent-gold);
            cursor: pointer;
        }
        .time-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #ccc;
            font-weight: 700;
        }

        .sidebar {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #888;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-size: 0.8rem;
        }
        .tab-btn.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
            background: rgba(255, 211, 42, 0.05);
        }
        .tab-content {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
            max-height: 650px;
        }

        .legend-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.75rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .icon-symbol { font-weight: bold; font-family: 'JetBrains Mono', monospace; }

        .tactical-event {
            background: #1a202c;
            border-left: 3px solid var(--accent-gold);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 0 4px 4px 0;
            font-size: 0.8rem;
        }
        .tactical-event .time { color: var(--accent-gold); font-weight: bold; font-family: 'JetBrains Mono', monospace; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">СИМУЛЯЦИЯ ФРОНТА v2.0 // ТАКТИКА И КОТЛЫ</div>
        <div class="status-badge" id="phaseBadge">ФАЗА 1: ПОЗИЦИОННЫЕ БОИ</div>
    </header>

    <div class="main-container">
        <!-- Карта -->
        <div class="map-card">
            <div class="canvas-container">
                <canvas id="warMap"></canvas>
            </div>
            <div class="timeline-controls">
                <button class="play-btn" id="playBtn">▶ ЗАПУСК</button>
                <input type="range" class="slider" id="timeSlider" min="0" max="100" value="0">
                <div class="time-display" id="timeLabel">00:00 / 45:00</div>
            </div>
        </div>

        <!-- Боковая панель -->
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tacticsTab', this)">Сводка Боя</button>
                <button class="tab-btn" onclick="switchTab('unitsTab', this)">Состав Войск</button>
            </div>

            <div id="tacticsTab" class="tab-content">
                <div class="legend-box">
                    <div class="legend-item"><span class="icon-symbol" style="color:#ffd32a;">★</span> Командир</div>
                    <div class="legend-item"><span class="icon-symbol" style="color:#00a8ff;">■</span> Танковая рота</div>
                    <div class="legend-item"><span class="icon-symbol" style="color:#ff3f34;">▲</span> Артиллерия</div>
                    <div class="legend-item"><span class="icon-symbol" style="color:#fff;">●</span> Пехота / Стримеры</div>
                </div>

                <h4 style="margin-bottom: 10px; font-size: 0.85rem; color: #888;">ХРОНИКА ОПЕРАЦИИ:</h4>
                <div id="eventsList">
                    <!-- Заполняется динамически через JS -->
                </div>
            </div>

            <div id="unitsTab" class="tab-content hidden">
                <p style="font-size:0.8rem; color:#aaa; margin-bottom:10px;">Все войска и техника передвигаются в реальном времени по траекториям манёвров.</p>
                <div id="unitsListStatus"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warMap');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('timeSlider');
        const playBtn = document.getElementById('playBtn');
        const timeLabel = document.getElementById('timeLabel');
        const phaseBadge = document.getElementById('phaseBadge');
        const eventsList = document.getElementById('eventsList');

        let isPlaying = false;
        let animationTimer = null;

        // --- БАЗА ЮНИТОВ И ИХ ТРАЕКТОРЯМ (WAYPOINTS: % от ширины X и высоты Y) ---
        // x, y заданы в пропорциях карты (0.0 - 1.0) на разном % прогресса боя [0%, 30%, 50%, 75%, 100%]
        const units = [
            // СИНИЕ (BLUE)
            {
                name: "Владимир Путин", team: "blue", type: "commander",
                path: [
                    { p: 0, x: 0.15, y: 0.25 },
                    { p: 30, x: 0.22, y: 0.25 },
                    { p: 50, x: 0.18, y: 0.20 }, // Откат при прорыве
                    { p: 75, x: 0.45, y: 0.25 }, // Ответный прорыв!
                    { p: 100, x: 0.75, y: 0.25 }
                ]
            },
            {
                name: "Танковая Бригада 'Зубарев'", team: "blue", type: "tank",
                path: [
                    { p: 0, x: 0.20, y: 0.45 },
                    { p: 30, x: 0.35, y: 0.45 },
                    { p: 50, x: 0.25, y: 0.48 }, 
                    { p: 75, x: 0.58, y: 0.45 }, // Прорыв центра
                    { p: 100, x: 0.82, y: 0.45 }
                ]
            },
            {
                name: "SouLessFiend & DIANA", team: "blue", type: "infantry",
                path: [
                    { p: 0, x: 0.25, y: 0.60 },
                    { p: 30, x: 0.38, y: 0.62 },
                    { p: 45, x: 0.32, y: 0.68 }, // Зажаты в котел!
                    { p: 55, x: 0.35, y: 0.68 }, // Оборона в окружении
                    { p: 75, x: 0.52, y: 0.60 }, // Деблокированы!
                    { p: 100, x: 0.78, y: 0.60 }
                ]
            },
            {
                name: "Папич (Арт-Дивизион)", team: "blue", type: "artillery",
                path: [
                    { p: 0, x: 0.10, y: 0.75 },
                    { p: 50, x: 0.12, y: 0.78 },
                    { p: 100, x: 0.55, y: 0.75 }
                ]
            },
            {
                name: "Братишкин & zxc_dead", team: "blue", type: "infantry",
                path: [
                    { p: 0, x: 0.28, y: 0.82 },
                    { p: 35, x: 0.35, y: 0.80 },
                    { p: 48, x: 0.28, y: 0.75 }, // Попадают в котёл
                    { p: 75, x: 0.50, y: 0.80 },
                    { p: 100, x: 0.72, y: 0.80 }
                ]
            },

            // КРАСНЫЕ (RED)
            {
                name: "Степан Бандера", team: "red", type: "commander",
                path: [
                    { p: 0, x: 0.85, y: 0.30 },
                    { p: 30, x: 0.70, y: 0.30 },
                    { p: 50, x: 0.45, y: 0.35 }, // Глубокий охват
                    { p: 75, x: 0.35, y: 0.20 }, // Разгром
                    { p: 100, x: 0.15, y: 0.10, dead: true } // Уничтожен в конце
                ]
            },
            {
                name: "Танковый Клин 'Shadowraze'", team: "red", type: "tank",
                path: [
                    { p: 0, x: 0.80, y: 0.65 },
                    { p: 30, x: 0.60, y: 0.70 },
                    { p: 48, x: 0.30, y: 0.85 }, // Замыкают КОТЕЛ в тылу синих!
                    { p: 70, x: 0.45, y: 0.80, dead: true }, // Окружены и уничтожены при контрударе
                    { p: 100, x: 0.45, y: 0.80, dead: true }
                ]
            },
            {
                name: "Абузер Мидаса (Артиллерия)", team: "red", type: "artillery",
                path: [
                    { p: 0, x: 0.90, y: 0.50 },
                    { p: 50, x: 0.75, y: 0.50 },
                    { p: 75, x: 0.85, y: 0.50 },
                    { p: 100, x: 0.92, y: 0.50 }
                ]
            },
            {
                name: "Пехота 'Строго & Бумыч'", team: "red", type: "infantry",
                path: [
                    { p: 0, x: 0.75, y: 0.85 },
                    { p: 30, x: 0.55, y: 0.85 },
                    { p: 50, x: 0.40, y: 0.78 },
                    { p: 75, x: 0.68, y: 0.85 },
                    { p: 100, x: 0.88, y: 0.88 }
                ]
            }
        ];

        // Интерполяция координат между вейпоинтами
        function getUnitPos(unit, p) {
            const path = unit.path;
            if (p <= path[0].p) return path[0];
            if (p >= path[path.length - 1].p) return path[path.length - 1];

            for (let i = 0; i < path.length - 1; i++) {
                if (p >= path[i].p && p <= path[i+1].p) {
                    const t = (p - path[i].p) / (path[i+1].p - path[i].p);
                    const curX = path[i].x + t * (path[i+1].x - path[i].x);
                    const curY = path[i].y + t * (path[i+1].y - path[i].y);
                    const isDead = path[i+1].dead && p > (path[i+1].p - 5);
                    return { x: curX, y: curY, dead: isDead };
                }
            }
            return path[0];
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawMap(slider.value);
        }
        window.addEventListener('resize', resizeCanvas);

        function drawMap(progress) {
            const w = canvas.width;
            const h = canvas.height;
            const p = parseInt(progress);

            ctx.clearRect(0, 0, w, h);

            // 1. ФОН: Карта местности (Сетка + Река + Высоты)
            ctx.fillStyle = '#182b16';
            ctx.fillRect(0, 0, w, h);

            // Река
            ctx.strokeStyle = '#1d4e89';
            ctx.lineWidth = 30;
            ctx.beginPath();
            ctx.moveTo(w * 0.5, 0);
            ctx.bezierCurveTo(w * 0.55, h * 0.3, w * 0.45, h * 0.7, w * 0.52, h);
            ctx.stroke();

            // Сетка высот
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for(let x=0; x<w; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
            for(let y=0; y<h; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

            // 2. РАСЧЕТ ЛИНИИ ФРОНТА
            ctx.beginPath();
            let frontPoints = [];
            // Динамический изгиб линии фронта от текущих позиций передовых отрядов
            for (let yStep = 0; yStep <= h; yStep += 20) {
                let relY = yStep / h;
                let baseFrontX = 0.5;

                if (p < 30) {
                    baseFrontX = 0.5 - (p / 30) * 0.05;
                } else if (p <= 55) {
                    // Образуется глубокий дугообразный выступ Красных (Прорыв Бандеры)
                    let bulge = Math.sin(relY * Math.PI) * 0.28 * ((p - 30) / 25);
                    baseFrontX = 0.45 - bulge;
                } else {
                    // Контрудар Синих и Срезание выструпа
                    let subP = (p - 55) / 45;
                    let bulge = 0.28 * (1 - subP);
                    baseFrontX = 0.2 + (subP * 0.55) - (bulge > 0 ? bulge : 0);
                }
                frontPoints.push({ x: baseFrontX * w, y: yStep });
            }

            // Отрисовка закраски захваченных территорий
            // Синие
            ctx.fillStyle = 'rgba(0, 168, 255, 0.18)';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            frontPoints.forEach(pt => ctx.lineTo(pt.x, pt.y));
            ctx.lineTo(0, h);
            ctx.fill();

            // Красные
            ctx.fillStyle = 'rgba(255, 63, 52, 0.18)';
            ctx.beginPath();
            ctx.moveTo(w, 0);
            frontPoints.forEach(pt => ctx.lineTo(pt.x, pt.y));
            ctx.lineTo(w, h);
            ctx.fill();

            // Сама линия фронта
            ctx.strokeStyle = '#ffd32a';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 5]);
            ctx.beginPath();
            frontPoints.forEach((pt, idx) => {
                if (idx === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();
            ctx.setLineDash([]);

            // 3. ОТРИСОВКА «КОТЛА» (Encirlcement) на 35% - 60%
            if (p >= 35 && p <= 62) {
                const cauldronAlpha = p <= 50 ? (p - 35) / 15 : (62 - p) / 12;
                ctx.strokeStyle = `rgba(255, 63, 52, ${cauldronAlpha})`;
                ctx.lineWidth = 4;
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                // Окружность вокруг зажатых сил SouLess и Братишкина
                ctx.ellipse(w * 0.32, h * 0.72, 70, 45, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = `rgba(255, 63, 52, ${cauldronAlpha * 0.8})`;
                ctx.font = 'bold 11px JetBrains Mono';
                ctx.fillText("КОТЁЛ #1 (ОКРУЖЕНИЕ)", w * 0.32 - 60, h * 0.72 - 50);
            }

            // 4. ОТРИСОВКА ЮНИТОВ И ТЕХНИКИ
            units.forEach(u => {
                const pos = getUnitPos(u, p);
                const realX = pos.x * w;
                const realY = pos.y * h;
                const color = u.team === 'blue' ? '#00a8ff' : '#ff3f34';

                drawTacticalIcon(realX, realY, color, u.type, u.name, pos.dead);
            });

            // Обновление текстовой хроники
            updateChronicle(p);
        }

        // Отрисовка военных значков техники и видов войск
        function drawTacticalIcon(x, y, color, type, name, isDead) {
            ctx.save();
            ctx.translate(x, y);

            if (isDead) {
                ctx.globalAlpha = 0.3;
            }

            // Иконка
            if (type === 'commander') {
                // Звезда / Командир
                ctx.fillStyle = '#ffd32a';
                ctx.beginPath();
                ctx.arc(0, 0, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (type === 'tank') {
                // Квадрат (Танковая рота)
                ctx.fillStyle = color;
                ctx.fillRect(-8, -8, 16, 16);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-8, -8, 16, 16);
                // Пушка
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(12, 0); ctx.stroke();
            } else if (type === 'artillery') {
                // Ромб (Артиллерия)
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(0, -9); ctx.lineTo(9, 0); ctx.lineTo(0, 9); ctx.lineTo(-9, 0);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.stroke();
            } else {
                // Круг (Пехота / Отряды)
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // Метка смерти
            if (isDead) {
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-10, -10); ctx.lineTo(10, 10);
                ctx.moveTo(10, -10); ctx.lineTo(-10, 10);
                ctx.stroke();
            }

            // Название юнита
            ctx.fillStyle = isDead ? '#888' : '#ffffff';
            ctx.font = '10px JetBrains Mono';
            ctx.fillText(name, 12, 4);

            ctx.restore();
        }

        function updateChronicle(p) {
            let phase = "ФАЗА 1: ПОЗИЦИОННЫЕ БОИ НА РЕКЕ";
            let eventsHTML = "";

            if (p < 30) {
                phase = "ФАЗА 1: ПРИГРАНИЧНЫЕ СТЫЧКИ И РАЗВЕДКА";
                eventsHTML = `
                    <div class="tactical-event">
                        <span class="time">05:00</span> Танковые группы Зубарева выдвигаются к реке.
                    </div>
                    <div class="tactical-event">
                        <span class="time">15:00</span> Арт-обстрел позиций от Папича и Абузера Мидаса.
                    </div>`;
            } else if (p < 55) {
                phase = "ФАЗА 2: ФЛАНГОВЫЙ ПРОРЫВ БАНДЕРЫ И КОТЁЛ";
                phaseBadge.style.borderColor = "var(--accent-red)";
                phaseBadge.style.color = "var(--accent-red)";
                eventsHTML = `
                    <div class="tactical-event" style="border-color: var(--accent-red)">
                        <span class="time">35:00</span> <b>ПРОРЫВ!</b> Танковый клин 'Shadowraze' срезает фланги!
                    </div>
                    <div class="tactical-event" style="border-color: var(--accent-red)">
                        <span class="time">45:00</span> <b>ОКРУЖЕНИЕ!</b> Группа SouLessFiend & DIANA зажата в Котёл #1.
                    </div>`;
            } else {
                phase = "ФАЗА 3: КОНТРУДАР ПУТИНА И РАЗГРОМ ВРАГА";
                phaseBadge.style.borderColor = "var(--accent-blue)";
                phaseBadge.style.color = "var(--accent-blue)";
                eventsHTML = `
                    <div class="tactical-event" style="border-color: var(--accent-blue)">
                        <span class="time">65:00</span> <b>ДЕБЛОКАДА!</b> Путин и Зубарев пробивают коридор к окружённым!
                    </div>
                    <div class="tactical-event" style="border-color: var(--accent-gold)">
                        <span class="time">85:00</span> Котёл Красных замкнут. Штаб Бандеры уничтожен.
                    </div>`;
            }

            phaseBadge.innerText = phase;
            eventsList.innerHTML = eventsHTML;
        }

        // Контроллер времени
        slider.addEventListener('input', () => {
            const mins = Math.floor((slider.value / 100) * 45);
            timeLabel.innerText = `${mins < 10 ? '0' : ''}${mins}:00 / 45:00`;
            drawMap(slider.value);
        });

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.innerText = isPlaying ? '❚❚ ПАУЗА' : '▶ ЗАПУСК';

            if (isPlaying) {
                animationTimer = setInterval(() => {
                    if (parseInt(slider.value) >= 100) slider.value = 0;
                    slider.value = parseInt(slider.value) + 1;
                    slider.dispatchEvent(new Event('input'));
                }, 150);
            } else {
                clearInterval(animationTimer);
            }
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            btn.classList.add('active');
        }

        setTimeout(resizeCanvas, 100);
    </script>
</body>
</html>
