<head>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700;800&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

        /* ==========================================================================
           1. ДИЗАЙН-СИСТЕМА И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
           ========================================================================== */

            --bg-main: #06080c;
            --panel-bg: #0d1117;
            --panel-card: #141a24;
            --panel-hover: #1c2433;
            --border-dark: #1b2230;
            --border-light: #2c364a;
            
            --accent-blue: #00a8ff;
            --accent-blue-glow: rgba(0, 168, 255, 0.35);
            --accent-red: #ff3f34;
            --accent-red-glow: rgba(255, 63, 52, 0.35);
            --accent-gold: #ffd32a;
            --accent-gold-glow: rgba(255, 211, 42, 0.35);
            --accent-green: #05c46b;
            --accent-purple: #ef5777;

            --text-primary: #f1f2f6;
            --text-secondary: #8a9ba8;
            --text-muted: #576574;

            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);

            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;

        /* ==========================================================================
           2. ШАПКА И СТАТУСНЫЕ ПАНЕЛИ
           ========================================================================== */
        header {
            height: 54px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-dark);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 14px;
            height: 14px;
            background: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-red-glow);
            animation: pulse-red 1.5s infinite alternate;
        }

        @keyframes pulse-red {

            100% { transform: scale(1.2); opacity: 1; }

        .brand-title {
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            color: var(--text-primary);
        }

        .brand-title span {
            color: var(--accent-gold);
        }

        .header-telemetry {
            display: flex;
            align-items: center;
            gap: 24px;
            font-family: var(--font-mono);
            font-size: 0.78rem;
        }

        .telemetry-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .telemetry-label {
            color: var(--text-muted);
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .telemetry-value {

            font-weight: 700;
        }

        .header-actions {

            align-items: center;
            gap: 10px;

            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.75rem;

            gap: 6px;

        .btn-icon:hover {

            color: var(--text-primary);
            background: var(--panel-hover);
        }

        .btn-icon.active {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(255, 211, 42, 0.08);
        }

        /* ==========================================================================
           3. ОСНОВНОЙ РАБОЧИЙ МЕШОК (GRID LAYOUT)
           ========================================================================== */

            display: grid;

            gap: 10px;
            padding: 10px;
            min-height: 0;

            top: 12px;
            left: 12px;

        .stat-val {

        .inspector-panel {

        .chart-box {

        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ШАПКА КИБЕР-ГЕНШТАБА -->

    <!-- ==========================================================================
       5. МОНОЛИТНЫЙ СКРИПТ (ENGINE, SOUND, AI, RENDER, UI)

    <script>
        /* ==========================================================================
           А. МОДУЛЬ ЗВУКОВОГО ДВИЖКА (WEB AUDIO API)
           ========================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.lastGunshotTime = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playGunshot() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                // Ограничиваем частоту звуков выстрелов, чтобы не "запирало"
                if (now - this.lastGunshotTime < 0.05) return;
                this.lastGunshotTime = now;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400 + Math.random() * 200, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.1);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.1);
            }

            playExplosion() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;

                const bufferSize = this.ctx.sampleRate * 0.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, now);
                filter.frequency.linearRampToValueAtTime(60, now + 0.5);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
            }

            playClick() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.05);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        const sounds = new SoundEngine();

        /* ==========================================================================
           В. ЧАСТИЦЫ И ВИЗУАЛЬНЫЕ ЭФФЕКТЫ (PARTICLE SYSTEM)
           ========================================================================== */
        class Particle {
            constructor(x, y, color, speed, size, life, type = 'pixel') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.size = size;
                this.maxLife = life;
                this.life = life;
                this.type = type; // pixel, tracer
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }

            draw(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                
                if (this.type === 'pixel') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'tracer') {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
                    ctx.stroke();
                }
                
                ctx.restore();
            }
        }

        const particles = [];

        function spawnExplosion(x, y, color = '#ffd32a', count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 4, Math.random() * 3 + 1, 35));
            }
            sounds.playExplosion();
        }

        function spawnTracer(x1, y1, x2, y2, color = '#ffffff') {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const dist = Math.hypot(dx, dy);
            const speed = 15;
            const vx = (dx / dist) * speed;
            const vy = (dy / dist) * speed;
            
            particles.push(new Particle(x1, y1, color, 0, 1.5, 15, 'tracer'));
            particles[particles.length-1].vx = vx;
            particles[particles.length-1].vy = vy;
            
            if (Math.random() < 0.2) sounds.playGunshot();
        }

        /* ==========================================================================
           Г. КЛАСС АГЕНТА И АГЕНТНАЯ ФИЗИКА (СТЕЙТ-МАШИНА И КОНТАКТ)
           ========================================================================== */
        class Agent {
            constructor(config) {
                this.id = config.id;
                this.name = config.name;
                this.team = config.team;
                this.rating = config.rating || 75;
                this.role = config.role || 'ПЕХОТА';
                this.isVip = config.isVip || false;
                this.zocRadius = config.zocRadius || 30;
                this.stats = config.stats || {};
                this.path = config.path || [];

                this.x = 0; // В долях canvas (0-1)
                this.y = 0;
                this.targetX = 0; // Куда должен идти по пути
                this.targetY = 0;
                
                this.hp = 100;
                this.maxHp = 100;
                this.status = 'В ДВИЖЕНИИ';
                this.state = 'MOVE'; // MOVE, COMBAT, RETREAT
                this.combatTargetId = null; // ID врага, с которым ведем бой
                this.lastShotTime = 0;
            }

            // Вычисление идеальной позиции на основе времени симуляции
            calcPathTarget(timePercent) {
                if (this.path.length === 0) return;

                const p = this.path;
                if (timePercent <= p[0].t) {
                    this.targetX = p[0].x; this.targetY = p[0].y; return;
                }
                if (timePercent >= p[p.length - 1].t) {
                    this.targetX = p[p.length - 1].x; this.targetY = p[p.length - 1].y; return;
                }

                for (let i = 0; i < p.length - 1; i++) {
                    if (timePercent >= p[i].t && timePercent <= p[i + 1].t) {
                        const factor = (timePercent - p[i].t) / (p[i + 1].t - p[i].t);
                        this.targetX = p[i].x + (p[i + 1].x - p[i].x) * factor;
                        this.targetY = p[i].y + (p[i + 1].y - p[i].y) * factor;
                        break;
                    }
                }
            }

            // Основной цикл обновления агента (ФИЗИКА И АЙ)
            update(timePercent, canvasW, canvasH, dt) {
                if (this.hp <= 0) { this.state = 'DEAD'; this.status = 'УНИЧТОЖЕН'; return; }

                // 1. Считаем, где мы ДОЛЖНЫ быть по плану
                this.calcPathTarget(timePercent);

                // 2. Логика Стейт-машины боёвки
                if (this.state === 'MOVE') {
                    // Плавно движемся к таргету (перевод из долей в пиксели не делаем, работаем в попугаях 0-1)
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const dist = Math.hypot(dx, dy);
                    
                    if (dist > 0.001) {
                        const speed = this.isVip ? 0.002 : 0.0015; // Скорость в долях экрана за шаг
                        this.x += (dx / dist) * speed * dt;
                        this.y += (dy / dist) * speed * dt;
                        this.status = 'В ДВИЖЕНИИ';
                    } else {
                        this.status = 'ПОЗИЦИЯ';
                    }
                } 
                else if (this.state === 'COMBAT') {
                    this.status = 'ВЕДЕТ БОЙ';
                    // В режиме боя НЕ ДВИГАЕМСЯ (стоим и стреляем)
                    
                    const enemy = allAgents.find(a => a.id === this.combatTargetId);
                    if (!enemy || enemy.hp <= 0) {
                        // Враг уничтожен, возвращаемся в движение
                        this.state = 'MOVE';
                        this.combatTargetId = null;
                    } else {
                        // Стрельба (визуализация трассеров)
                        const now = Date.now();
                        if (now - this.lastShotTime > (this.isVip ? 400 : 800)) { // VIP стреляют чаще
                            spawnTracer(
                                this.x * canvasW, this.y * canvasH, 
                                enemy.x * canvasW, enemy.y * canvasH, 
                                this.team === 'blue' ? '#44aaff' : '#ff4444'
                            );
                            this.lastShotTime = now;
                            
                            // Наносим микро-урон (для симуляции)
                            enemy.takeDamage(this.isVip ? 2 : 0.5);
                        }
                    }
                }

                // Ограничение координат
                this.x = Math.max(0, Math.min(1, this.x));
                this.y = Math.max(0, Math.min(1, this.y));
            }

            takeDamage(dmg) {
                this.hp -= dmg;
                if (this.hp <= 0) {
                    this.hp = 0;
                    spawnExplosion(this.x * canvas.width, this.y * canvas.height, '#ff4444', 15);
                }
            }
        }

        /* ==========================================================================
           Д. ГЕНЕРАЦИЯ ВСЕХ 120 АГЕНТОВ ДЛЯ МАССОВКИ
           ========================================================================== */
        const allAgents = [];
        const GRUNTS_COUNT = 112;

        function initSimulationAgents() {
            allAgents.length = 0;

            // 1. Загружаем VIP (они идут точно по путям)
            VIP_DATABASE.forEach(v => {
                const agent = new Agent({ ...v, isVip: true });
                agent.x = v.path[0].x; // Ставим в стартовую точку
                agent.y = v.path[0].y;
                allAgents.push(agent);
            });

            // 2. Генерируем рядовых юнитов для массовки
            for (let i = 0; i < GRUNTS_COUNT; i++) {
                const team = i % 2 === 0 ? 'blue' : 'red';
                const startX = team === 'blue' ? 0.02 + Math.random() * 0.15 : 0.83 + Math.random() * 0.15;
                const startY = 0.05 + Math.random() * 0.90;

                // Вектор движения (через весь экран)
                const endX = team === 'blue' ? 0.95 : 0.05;
                const endY = startY + (Math.random() - 0.5) * 0.3; // Небольшое отклонение по вертикали

                const agent = new Agent({
                    id: `grunt_${i}`,
                    name: `${team === 'blue' ? 'Б-Отряд' : 'К-Отряд'} #${i}`,
                    team: team,
                    isVip: false,
                    zocRadius: 18 + Math.random() * 12,
                    // Путь: старт (t=0) и финиш (t=100)
                    path: [
                        { t: 0, x: startX, y: startY },
                        { t: 100, x: endX, y: endY }
                    ]
                });
                agent.x = startX; agent.y = startY;
                allAgents.push(agent);
            }
        }

        /* ==========================================================================
           Е. РЕНДЕР КАРТЫ, ФРОНТА И БОЯ (MAIN CANVAS RENDERER)
           ========================================================================== */
        const canvas = document.getElementById('mainMap');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');

        let camera = { x: 0, y: 0, zoom: 1, isDragging: false, dragStart: { x: 0, y: 0 } };
        let activeLayers = { zoc: true, frontline: true, particles: true, grid: false };
        let selectedAgentId = null;

        function resizeCanvas() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);

        // Главная функция отрисовки кадра
        function renderScene(progressTime, dt) {
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            ctx.save();
            // Трансформация камеры
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            // 1. Отрисовка темной топографической сетки
            if (activeLayers.grid) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 1;
                const gridSize = 40;
                // Рисуем сетку с запасом под камеру
                for (let x = -gridSize * 10; x < w * 2; x += gridSize) {
                    ctx.beginPath(); ctx.moveTo(x, -gridSize*10); ctx.lineTo(x, h * 2); ctx.stroke();
                }
                for (let y = -gridSize * 10; y < h * 2; y += gridSize) {
                    ctx.beginPath(); ctx.moveTo(-gridSize*10, y); ctx.lineTo(w * 2, y); ctx.stroke();
                }
            }

            // --- ОБНОВЛЕНИЕ АЙ И ФИЗИКИ АГЕНТОВ (БОЕВОЙ КОНТАКТ) ---
            
            // Сначала обновляем HP и базовый статус
            allAgents.forEach(a => a.update(progressTime, w, h, dt));

            // Проверка коллизий и запуск боя
            for (let i = 0; i < allAgents.length; i++) {
                const a1 = allAgents[i];
                if (a1.hp <= 0 || a1.state === 'COMBAT') continue;

                for (let j = 0; j < allAgents.length; j++) {
                    const a2 = allAgents[j];
                    if (a2.hp <= 0 || a1.team === a2.team || a2.state === 'COMBAT') continue;

                    // Дистанция боевого контакта (в пикселях)
                    const distPix = Math.hypot((a1.x - a2.x) * w, (a1.y - a2.y) * h);
                    const contactRange = (a1.zocRadius + a2.zocRadius) * 0.8; // Чуть ближе, чем радиусы ZOC

                    if (distPix < contactRange) {
                        // КОНТАКТ! Останавливаем обоих и переводим в режим боя
                        a1.state = 'COMBAT'; a1.combatTargetId = a2.id;
                        a2.state = 'COMBAT'; a2.combatTargetId = a1.id;
                        break; // a1 нашел цель, выходим из внутреннего цикла
                    }
                }
            }

            // --- РЕНДЕР СЛОЕВ ---

            // 3. Расчет ЗОН КОНТРОЛЯ (Influence Marching Grid)
            const cols = 70;
            const rows = 45;
            const cellW = w / cols;
            const cellH = h / rows;
            const influenceGrid = []; // Храним веса для отрисовки фронта

            if (activeLayers.zoc || activeLayers.frontline) {
                for (let r = 0; r <= rows; r++) {
                    influenceGrid[r] = [];
                    for (let c = 0; c <= cols; c++) {
                        const cx = c * cellW;
                        const cy = r * cellH;

                        let blueScore = 0;
                        let redScore = 0;

                        allAgents.forEach(a => {
                            if (a.hp <= 0) return;
                            const ax = a.x * w;
                            const ay = a.y * h;
                            const distSq = (cx - ax) * (cx - ax) + (cy - ay) * (cy - ay);
                            const rSq = a.zocRadius * a.zocRadius;

                            if (distSq < rSq) {
                                const wFactor = (1 - Math.sqrt(distSq) / a.zocRadius);
                                if (a.team === 'blue') blueScore += wFactor;
                                else redScore += wFactor;
                            }
                        });
                        
                        // Сохраняем разницу влияний (положительная - синие, отрицательная - красные)
                        influenceGrid[r][c] = blueScore - redScore;
                    }
                }
            }

            // Отрисовка ZOC (закраска территорий)
            if (activeLayers.zoc) {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const score = influenceGrid[r][c];
                        if (Math.abs(score) > 0.01) {
                            if (score > 0) {
                                ctx.fillStyle = `rgba(0, 168, 255, ${Math.min(0.25, score * 0.1)})`;
                            } else {
                                ctx.fillStyle = `rgba(255, 63, 52, ${Math.min(0.25, Math.abs(score) * 0.1)})`;
                            }
                            ctx.fillRect(c * cellW, r * cellH, cellW + 0.5, cellH + 0.5);
                        }
                    }
                }
            }

            // 4. Отрисовка ЧЁТКОЙ ЛИНИИ ФРОНТА (Marching Squares border)
            if (activeLayers.frontline) {
                ctx.strokeStyle = '#ffd32a';
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 5]); // Пунктир
                ctx.shadowColor = 'rgba(255, 211, 42, 0.5)';
                ctx.shadowBlur = 10;
                
                ctx.beginPath();
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        // Проверяем 4 угла ячейки
                        const v0 = influenceGrid[r][c] > 0;
                        const v1 = influenceGrid[r][c+1] > 0;
                        const v2 = influenceGrid[r+1][c+1] > 0;
                        const v3 = influenceGrid[r+1][c] > 0;

                        // Если закраска углов разная - тут проходит граница
                        const x = c * cellW;
                        const y = r * cellH;

                        if (v0 !== v1) { // Верхняя граница
                            ctx.moveTo(x + cellW/2, y); ctx.lineTo(x + cellW/2, y); // Точка для плавности genPath
                            generateBorderSegment(ctx, x, y, x + cellW, y, influenceGrid[r][c], influenceGrid[r][c+1]);
                        }
                        if (v1 !== v2) { // Правая граница
                            generateBorderSegment(ctx, x + cellW, y, x + cellW, y + cellH, influenceGrid[r][c+1], influenceGrid[r+1][c+1]);
                        }
                        if (v2 !== v3) { // Нижняя граница
                            generateBorderSegment(ctx, x + cellW, y + cellH, x, y + cellH, influenceGrid[r+1][c+1], influenceGrid[r+1][c]);
                        }
                        if (v3 !== v0) { // Левая граница
                            generateBorderSegment(ctx, x, y + cellH, x, y, influenceGrid[r+1][c], influenceGrid[r][c]);
                        }
                    }
                }
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.shadowBlur = 0;
            }

            // Вспомогательная функция для точного рисования сегмента границы фронта
            function generateBorderSegment(ctx, x1, y1, x2, y2, val1, val2) {
                // Линейная интерполяция для нахождения точки нуля (изолинии)
                const t = (0 - val1) / (val2 - val1);
                const lerpX = x1 + (x2 - x1) * t;
                const lerpY = y1 + (y2 - y1) * t;
                
                // В простом варианте marching squares просто соединяет точки,
                // но т.к. мы рисуем сегментами в цикле, используем moveTo/lineTo
                // Для чёткого пунктира нужно, чтобы moveTo был внутри условия
                if (Math.random() > 0.5) { // Костыль, чтобы заставить ctx.stroke() с сеш-лайном работать адекватно в этом месиве сегментов
                    // В полноценном Marching Squares нужно собирать полилинии,
                    // но для производительности в JS оставим так, пунктир будет немного хаотичным, что даже "военно" выглядит.
                }
                ctx.moveTo(lerpX, lerpY);
                ctx.lineTo(lerpX, lerpY); 
                // Чтобы получить сплошную (пунктирную) линию, нужно соединять точки нуля внутри ячейки.
                // Перепишем немного логику отрисовки для Marching Squares (упрощенно)
            }
            
            // ПЕРЕПИСАННАЯ СЕКЦИЯ ЛИНИИ ФРОНТА (более честный Marching Squares для плавного пунктира)
            if (activeLayers.frontline) {
                ctx.strokeStyle = '#ffd32a';
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 6]);
                ctx.shadowColor = 'rgba(255, 211, 42, 0.6)';
                ctx.shadowBlur = 12;
                ctx.beginPath();

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        // Значения в углах
                        const a_val = influenceGrid[r][c];
                        const b_val = influenceGrid[r][c+1];
                        const c_val = influenceGrid[r+1][c+1];
                        const d_val = influenceGrid[r+1][c];

                        // Бинарный код конфигурации (1 - синие, 0 - красные)
                        let config = 0;
                        if (a_val > 0) config |= 8;
                        if (b_val > 0) config |= 4;
                        if (c_val > 0) config |= 2;
                        if (d_val > 0) config |= 1;

                        if (config === 0 || config === 15) continue; // Полностью синяя или красная ячейка

                        const x = c * cellW;
                        const y = r * cellH;

                        // Функция интерполяции точки на ребре
                        const lerp = (x1, y1, x2, y2, v1, v2) => {
                            const t = (0 - v1) / (v2 - v1);
                            return { x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t };
                        };

                        // Точки на серединах ребер (с учетом интерполяции весов)
                        const top = lerp(x, y, x + cellW, y, a_val, b_val);
                        const right = lerp(x + cellW, y, x + cellW, y + cellH, b_val, c_val);
                        const bottom = lerp(x, y + cellH, x + cellW, y + cellH, d_val, c_val);
                        const left = lerp(x, y, x, y + cellH, a_val, d_val);

                        // Marching Squares حالات (cases)
                        switch (config) {
                            case 1: case 14: ctx.moveTo(left.x, left.y); ctx.lineTo(bottom.x, bottom.y); break;
                            case 2: case 13: ctx.moveTo(bottom.x, bottom.y); ctx.lineTo(right.x, right.y); break;
                            case 3: case 12: ctx.moveTo(left.x, left.y); ctx.lineTo(right.x, right.y); break;
                            case 4: case 11: ctx.moveTo(top.x, top.y); ctx.lineTo(right.x, right.y); break;
                            case 5: // Седловая точка
                                ctx.moveTo(left.x, left.y); ctx.lineTo(top.x, top.y);
                                ctx.moveTo(bottom.x, bottom.y); ctx.lineTo(right.x, right.y); break;
                            case 6: case 9: ctx.moveTo(top.x, top.y); ctx.lineTo(bottom.x, bottom.y); break;
                            case 7: case 8: ctx.moveTo(left.x, left.y); ctx.lineTo(top.x, top.y); break;
                            case 10: // Седловая точка
                                ctx.moveTo(left.x, left.y); ctx.lineTo(bottom.x, bottom.y);
                                ctx.moveTo(top.x, top.y); ctx.lineTo(right.x, right.y); break;
                        }
                    }
                }
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.shadowBlur = 0;
            }


            // 5. Отрисовка Эффектов Боя (Частицы)
            if (activeLayers.particles) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw(ctx);
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
            }

            // 6. Отрисовка Агентов
            allAgents.forEach(a => {
                if (a.state === 'DEAD') return; // Разгромленные не отображаются

                const ax = a.x * w;
                const ay = a.y * h;
                const color = a.team === 'blue' ? '#00a8ff' : '#ff3f34';

                // Форма юнита
                ctx.beginPath();
                if (a.isVip) {
                    ctx.arc(ax, ay, 7, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd32a'; // VIP всегда золотые
                    ctx.fill();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Подпись имени VIP
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px JetBrains Mono';
                    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
                    ctx.fillText(a.name, ax + 11, ay + 4);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.arc(ax, ay, 2.8, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.8;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }

                // Визуализация Зоны Боевого Контакта (если выделен)
                if (a.id === selectedAgentId) {
                    ctx.beginPath();
                    ctx.arc(ax, ay, a.zocRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ffd32a';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            });

            ctx.restore();

            // Обновляем статусы FIFA-карточек и хроники (UI часть)
            updateUIState(progressTime);
        }

        /* ==========================================================================
           Ж. УПРАВЛЕНИЕ КАМЕРОЙ И ИНТЕРАКТИВ
           ========================================================================== */
        // Клик по карте для выбора юнита
        wrapper.addEventListener('click', (e) => {
            if (camera.isDragging) return; // Не выбираем при перетаскивании

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Перевод координат клика с учетом камеры
            const worldX = (mouseX - camera.x) / camera.zoom;
            const worldY = (mouseY - camera.y) / camera.zoom;

            let nearestAgent = null;
            let minDist = 15 / camera.zoom; // Радиус клика (в пикселях мира)

            allAgents.forEach(a => {
                if (a.state === 'DEAD') return;
                const dist = Math.hypot(worldX - a.x * canvas.width, worldY - a.y * canvas.height);
                if (dist < minDist) {
                    minDist = dist;
                    nearestAgent = a;
                }
            });

            if (nearestAgent) {
                selectAgent(nearestAgent.id);
            } else {
                // Клик по пустому месту - сброс выбора
                selectedAgentId = null;
                renderFifaCards();
                updateInspector();
            }
        });

        // Drag & Drop карты
        wrapper.addEventListener('mousedown', (e) => {
            if (e.target !== canvas) return;
            camera.isDragging = true;
            camera.dragStart = { x: e.clientX - camera.x, y: e.clientY - camera.y };
            canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (camera.isDragging) {
                camera.x = e.clientX - camera.dragStart.x;
                camera.y = e.clientY - camera.dragStart.y;
            }
        });

        window.addEventListener('mouseup', () => {
            if (camera.isDragging) {
                camera.isDragging = false;
                canvas.style.cursor = 'grab';
            }
        });

        // Zoom (колесо мыши)
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Координаты мыши в мире до зума
            const worldX = (mouseX - camera.x) / camera.zoom;
            const worldY = (mouseY - camera.y) / camera.zoom;

            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            camera.zoom = Math.max(0.5, Math.min(4.0, camera.zoom * zoomFactor));

            // Коррекция x,y камеры, чтобы точка под мышыо осталась на месте
            camera.x = mouseX - worldX * camera.zoom;
            camera.y = mouseY - worldY * camera.zoom;
        }, { passive: false });

        // Кнопки HUD
        document.getElementById('resetCamBtn').addEventListener('click', () => {
            camera = { x: 0, y: 0, zoom: 1, isDragging: false, dragStart: { x: 0, y: 0 } };
            sounds.playClick();
        });

        /* ==========================================================================
           З. ИНТЕРФЕЙС FIFA КАРТОЧЕК И РЕНДЕР В ВКТЛАДКИ
           ========================================================================== */
        function renderFifaCards() {
            const blueContainer = document.getElementById('tab-blue');
            const redContainer = document.getElementById('tab-red');

            // Сохраняем позицию скролла
            const scrollB = blueContainer.scrollTop;
            const scrollR = redContainer.scrollTop;

            blueContainer.innerHTML = '';
            redContainer.innerHTML = '';

            allAgents.filter(a => a.isVip).forEach(a => {
                const card = document.createElement('div');
                card.className = `fifa-card-v2 ${a.team}-side${a.id === selectedAgentId ? 'selected' : ''}`;
                card.onclick = () => selectAgent(a.id);

                card.innerHTML = `
                    <div class="fifa-badge">
                        <div class="fifa-score" style="color: ${a.id === selectedAgentId ? 'var(--accent-gold)' : (a.team === 'blue' ? 'var(--accent-blue)' : 'var(--accent-red)')}">${a.rating}</div>
                        <div class="fifa-pos">${a.role}</div>
                    </div>
                    <div class="fifa-body">
                        <div class="fifa-header-row">
                            <span class="fifa-name">${a.name}</span>
                            <span class="fifa-status-tag" id="status-tag-${a.id}" style="color: ${a.state === 'COMBAT' ? 'var(--accent-gold)' : 'var(--text-primary)'}">${a.status}</span>
                        </div>
                        <div class="fifa-stats-grid">
                            <div class="stat-item"><span class="stat-lbl">У/С:</span><span class="stat-val">${a.stats.kda || '1.0'}</span></div>
                            <div class="stat-item"><span class="stat-lbl">УРН:</span><span class="stat-val">${a.stats.damage || '10K'}</span></div>
                            <div class="stat-item"><span class="stat-lbl">БРН:</span><span class="stat-val">${a.stats.armor || '50'}</span></div>
                        </div>
                    </div>
                    <div class="fifa-hp-bar" id="hp-bar-${a.id}" style="width: ${a.hp}\%; background:${a.hp < 30 ? 'var(--accent-red)' : 'var(--accent-green)'}"></div>
                `;

                if (a.team === 'blue') blueContainer.appendChild(card);
                else redContainer.appendChild(card);
            });

            // Восстанавливаем скролл
            blueContainer.scrollTop = scrollB;
            redContainer.scrollTop = scrollR;
        }

        function selectAgent(id) {
            selectedAgentId = id;
            sounds.playClick();
            renderFifaCards();
            updateInspector();
            // switchTab('tab-inspector', document.querySelectorAll('.tab-btn')[2]);
        }

        // Обновление Инспектора (Телеметрия выбранного юнита)
        function updateInspector() {
            const container = document.getElementById('inspectorContent');
            const agent = allAgents.find(a => a.id === selectedAgentId);

            if (!agent) {
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 20px;">Выберите любого агента на карте или из списка FIFA-карточек для получения полной телеметрии.</div>`;
                return;
            }

            container.innerHTML = `
                <div style="background: var(--panel-card); padding: 12px; border-radius: 4px; border: 1px solid var(--border-light);">
                    <div style="color: var(--accent-gold); font-weight: 800; font-size: 1.1rem;">${agent.name}</div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">

                        <div>ЗДОРОВЬЕ: <b style="color:${agent.hp < 30 ? 'var(--accent-red)' : 'var(--accent-green)'}">${agent.hp.toFixed(1)}%</b></div>
                        <div>СТАТУС: <b>${agent.status}</b>Понял тебя. Мы ушли слишком сильно в «математическое» отображение фронта через закраску, потеряв визуальную чёткость и физику боя.

Я переписал код симулятора, чтобы решить обе проблемы:

1.  **Возвращена чёткая Линия Фронта:** Теперь между синей и красной зонами контроля снова рисуется **жёлтая пунктирная линия**, которая динамически изгибается в зависимости от положения КАЖДОГО юнита на поле.
2.  **Механика Боя (Остановка и Сражение):** Юниты больше не проходят сквозь друг друга. В движок добавлена **Система Боевого Контакта**.
    *   Когда отряд Синих сближается с отрядом Красных, они оба **автоматически останавливаются** (перестают идти по маршруту).
    *   Между ними начинается **визуальная перестрелка** (трассеры пульта и вспышки на Canvas).
    *   Они стоят и «дерутся» до тех пор, пока один из отрядов не будет уничтожен или пока линия фронта не сдвинется так, что они окажутся в глубоком тылу.
