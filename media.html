<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick.id | Premium Video Hub</title>
    
    <!-- Подключаем современные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
            CSS ПЕРЕМЕННЫЕ (ТЕМАТИЗАЦИЯ)
            ========================================================================== */
        :root {
            --bg-base: #0f0f13;
            --bg-surface: #1c1c24;
            --bg-surface-hover: #2a2a35;
            --bg-glass: rgba(28, 28, 36, 0.7);
            
            --accent-primary: #ff4181;
            --accent-primary-hover: #ff1c6b;
            --accent-secondary: #7c3aed;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --text-dark: #1f2937;
            
            --border-light: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 65, 129, 0.3);
            
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.6);
            --shadow-neon: 0 0 15px rgba(255, 65, 129, 0.4);
            
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            --font-sans: 'Poppins', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(124, 58, 237, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 65, 129, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f4e;
            border-radius: var(--radius-full);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        .sidebar {
            width: 260px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 50;
            transition: var(--transition-normal);
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: calc(100% - 260px);
        }

        .brand-zone {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .logo-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-neon);
            transition: var(--transition-normal);
        }
        .logo-avatar:hover {
            transform: scale(1.05) rotate(-5deg);
        }

        .brand-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, #ff4181);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .nav-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 600;
            margin: 10px 0 5px 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition-fast);
            border: 1px solid transparent;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            opacity: 0.8;
            transition: var(--transition-fast);
        }

        .nav-item:hover {
            background-color: var(--bg-surface-hover);
            color: var(--text-main);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(255, 65, 129, 0.15), transparent);
            color: var(--accent-primary);
            border-left: 3px solid var(--accent-primary);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
        }
        .nav-item.active svg {
            opacity: 1;
        }

        .sub-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: var(--transition-fast);
        }
        .sub-item:hover { background-color: var(--bg-surface-hover); }
        .sub-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        .sub-name { font-size: 13px; font-weight: 500; color: #ccc; }
        .live-badge {
            width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-danger);
            margin-left: auto; box-shadow: 0 0 5px var(--accent-danger);
        }

        .top-header {
            height: 80px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(15, 15, 19, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 40;
            border-bottom: 1px solid var(--border-light);
        }

        .search-bar {
            position: relative;
            width: 400px;
        }
        .search-input {
            width: 100%;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 12px 20px 12px 45px;
            border-radius: var(--radius-full);
            font-family: var(--font-sans);
            font-size: 14px;
            transition: var(--transition-normal);
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent-secondary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px; height: 18px;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-normal);
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #fff;
            box-shadow: var(--shadow-neon);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 129, 0.6);
        }

        .btn-twitch {
            background-color: #6441a5;
            color: #fff;
        }
        .btn-twitch:hover { background-color: #7d5bbe; }

        .content-area {
            padding: 30px 40px;
            flex: 1;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .page-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .filter-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }

        .chip {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chip:hover {
            background-color: var(--bg-surface-hover);
            color: var(--text-main);
        }
        .chip.active {
            background-color: var(--text-main);
            color: var(--bg-base);
            border-color: var(--text-main);
        }
        .chip-count {
            font-size: 11px;
            background: rgba(128,128,128,0.2);
            padding: 2px 6px;
            border-radius: 10px;
        }
        .chip.active .chip-count { background: rgba(0,0,0,0.1); }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .video-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition-normal);
            cursor: pointer;
            position: relative;
        }
        .video-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-glow);
            box-shadow: var(--shadow-md);
        }

        .card-thumb {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
            overflow: hidden;
        }
        .card-thumb img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .video-card:hover .card-thumb img { transform: scale(1.08); }

        .badge-top, .badge-duration {
            position: absolute;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-mono);
            z-index: 2;
            pointer-events: none;
        }
        .badge-top { top: 10px; left: 10px; color: var(--accent-warning); }
        .badge-duration { bottom: 10px; right: 10px; }
        
        .play-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: var(--transition-normal);
            z-index: 3;
            pointer-events: none;
        }
        .video-card:hover .play-overlay { opacity: 1; }
        .play-btn-icon {
            width: 50px; height: 50px;
            background: var(--accent-primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-neon);
        }

        .card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .author-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .author-avatar {
            width: 24px; height: 24px;
            border-radius: 50%; background: linear-gradient(45deg, #7c3aed, #ff4181);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #fff; font-size: 11px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
        }
        
        .stat-text { font-size: 12px; color: var(--text-muted); display: flex; gap: 4px; align-items: center;}
        
        .btn-icon {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            width: 32px; height: 32px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition-fast);
            z-index: 4; /* чтобы кликалось поверх карточки */
        }
        .btn-icon:hover {
            border-color: var(--accent-danger);
            color: var(--accent-danger);
            background: rgba(239, 68, 68, 0.1);
        }

        /* МОДАЛЬНЫЕ ОКНА И ПЛЕЕР */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: var(--transition-normal);
        }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            width: 100%; max-width: 500px;
            padding: 30px;
            transform: translateY(20px);
            transition: var(--transition-normal);
            box-shadow: var(--shadow-md);
        }
        .modal-backdrop.active .modal-box { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-title { font-size: 20px; font-weight: 700; }
        .btn-close {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; padding: 5px; transition: 0.2s; font-size: 18px;
        }
        .btn-close:hover { color: #fff; transform: rotate(90deg); }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .form-input, .form-select {
            width: 100%; padding: 14px 16px;
            background: var(--bg-base); border: 1px solid var(--border-light);
            border-radius: var(--radius-sm); color: var(--text-main);
            font-family: var(--font-sans); font-size: 14px; outline: none;
            transition: 0.2s;
        }
        .form-input:focus, .form-select:focus { border-color: var(--accent-primary); }

        /* Плеер модалка */
        .player-modal { max-width: 900px; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
        .player-video-area { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        .player-video-area iframe { width: 100%; height: 100%; border: none; }
        .player-info-area { padding: 20px; display: flex; gap: 20px; background: var(--bg-surface); align-items: center; justify-content: space-between; }

        .toast-container {
            position: fixed; bottom: 30px; right: 30px;
            display: flex; flex-direction: column; gap: 10px; z-index: 9999;
        }
        .toast {
            background: var(--bg-surface); border-left: 4px solid var(--accent-primary);
            padding: 16px 20px; border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
            display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500;
            transform: translateX(120%); transition: var(--transition-normal);
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: var(--accent-success); }
        .toast.error { border-left-color: var(--accent-danger); }
        
        .dev-section { display: none; padding: 60px 20px; text-align: center; border: 2px dashed var(--border-light); border-radius: var(--radius-lg); margin-top: 20px;}
        .dev-section.active { display: block; }
        .dev-icon { font-size: 48px; margin-bottom: 20px; opacity: 0.5; }
    </style>
</head>
<body>

    <!-- SIDEBAR НАВИГАЦИЯ -->

    <!-- ОСНОВНАЯ ЗОНА -->
    <main class="main-content">
        <header class="top-header">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input" placeholder="Поиск видосов, стримов, тактик..." id="searchInput" onkeyup="filterVideos()">
            </div>
            
            <div class="user-actions">
                <button class="btn btn-twitch" onclick="showToast('Авторизация через Twitch', 'info')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
                    Войти (Twitch)
                </button>
            </div>
        </header>

        <!-- ХАБ ВИДЕО -->
        <div id="videos-tab" class="content-area">
            <div class="page-header">
                <h1 class="page-title">Предложка на стрим</h1>
                <button class="btn btn-primary" onclick="openAddModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Закинуть видос
                </button>
            </div>

            <!-- ФИЛЬТРЫ -->
            <div class="filter-scroll" id="categoryFilters">
                <button class="chip active" onclick="setFilter('Все', this)">Все</button>
                <button class="chip" onclick="setFilter('Игры', this)">Игры</button>
                <button class="chip" onclick="setFilter('Железо ПК', this)">Железо ПК</button>
                <button class="chip" onclick="setFilter('Спорт', this)">Спорт</button>
                <button class="chip" onclick="setFilter('Аниме', this)">Аниме</button>
                <button class="chip" onclick="setFilter('Смешные', this)">Смешные</button>
            </div>

            <!-- СЕТКА ВИДЕО -->
            <div class="video-grid" id="videoGridElement"></div>
            
            <div class="dev-section" id="emptyStateVideo">
                <div class="dev-icon">📭</div>
                <h3>В этой категории пусто</h3>
            </div>
        </div>

        <!-- ЛЕНТА -->
        <div id="feed-tab" class="content-area dev-section">
            <div class="dev-icon">🚧</div>
            <h2 class="page-title">Лента в разработке</h2>
        </div>

        <!-- НАСТРОЙКИ -->
        <div id="settings-tab" class="content-area dev-section">
            <h2 class="page-title" style="text-align: left; margin-bottom: 30px;">Настройки трансляции</h2>
            <div style="background: var(--bg-surface); padding: 30px; border-radius: var(--radius-lg); text-align: left; max-width: 600px;">
                <div class="form-group">
                    <label class="form-label">Статус Faceit Anti-Cheat TPM/Secure Boot</label>
                    <div style="padding: 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent-success); border-radius: var(--radius-sm); color: var(--accent-success); font-weight: 600; display: inline-flex; align-items: center; gap: 8px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg> BIOS Настроен (Зеленый статус)
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- МОДАЛКА ПЛЕЕРА -->
    <div class="modal-backdrop" id="playerModal" onclick="closePlayerModal(event)">
        <div class="modal-box player-modal" onclick="event.stopPropagation()">
            <div class="player-video-area">
                <iframe id="playerIframe" src="" allowfullscreen></iframe>
            </div>
            <div class="player-info-area">
                <div>
                    <h3 id="playerModalTitle" style="font-size: 16px; font-weight: 700; margin-bottom: 5px;"></h3>
                    <span id="playerModalAuthor" style="font-size: 13px; color: var(--text-muted);"></span>
                </div>
                <button class="btn btn-primary" onclick="closePlayerModalDirect()">Закрыть плеер</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ДОБАВЛЕНИЯ ВИДЕО -->
    <div class="modal-backdrop" id="addVideoModal" onclick="closeAddModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title">Закинуть видос на стрим</h3>
                <button class="btn-close" onclick="closeAddModalDirect()">✕</button>
            </div>
            <form id="addVideoForm" onsubmit="submitNewVideo(event)">
                <div class="form-group">
                    <label class="form-label">Название видео</label>
                    <input type="text" class="form-input" id="newVideoTitle" required placeholder="Например: Эпичный клатч...">
                </div>
                <div class="form-group">
                    <label class="form-label">Ссылка или ID с YouTube</label>
                    <input type="text" class="form-input" id="newVideoYt" required placeholder="Например: dQw4w9WgXcQ или ссылка">
                </div>
                <div class="form-group">
                    <label class="form-label">Категория</label>
                    <select class="form-select" id="newVideoCategory">
                        <option value="Игры">Игры</option>
                        <option value="Железо ПК">Железо ПК</option>
                        <option value="Спорт">Спорт</option>
                        <option value="Аниме">Аниме</option>
                        <option value="Смешные">Смешные</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Автор / Ник</label>
                    <input type="text" class="form-input" id="newVideoAuthor" required placeholder="Твой ник">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Добавить видос</button>
            </form>
        </div>
    </div>

    <!-- УВЕДОМЛЕНИЯ -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // База видео
        let videosData = [
            { id: 1, title: "Эпичный клатч 1 в 5 на FACEIT в CS2", category: "Игры", author: "steffrunn3r", duration: "03:45", ytId: "dQw4w9WgXcQ", views: "1.4K" },
            { id: 2, title: "Сравнение процессоров AMD Ryzen под новый сетап", category: "Железо ПК", author: "blondbane", duration: "12:20", ytId: "dQw4w9WgXcQ", views: "3.2K" },
            { id: 3, title: "Разбор лучших моментов Лиги Чемпионов", category: "Спорт", author: "Patrick", duration: "08:15", ytId: "dQw4w9WgXcQ", views: "950" },
            { id: 4, title: "Лучшие моменты с Сатору Годжо (Jujutsu Kaisen)", category: "Аниме", author: "Diana", duration: "04:10", ytId: "dQw4w9WgXcQ", views: "2.1K" },
            { id: 5, title: "Угарные моменты со стримов и дискорда", category: "Смешные", author: "ebanidolboeb", duration: "06:50", ytId: "dQw4w9WgXcQ", views: "4.5K" }
        ];

        let currentCategory = 'Все';

        function renderVideos(list) {
            const grid = document.getElementById('videoGridElement');
            const emptyState = document.getElementById('emptyStateVideo');
            
            grid.innerHTML = '';
            
            if (list.length === 0) {
                emptyState.classList.add('active');
                return;
            }
            emptyState.classList.remove('active');

            list.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => openPlayer(video);
                
                card.innerHTML = `
                    <div class="card-thumb">
                        <img src="https://img.youtube.com/vi/${video.ytId}/hqdefault.jpg" alt="${video.title}">
                        <div class="badge-top">${video.category}</div>
                        <div class="badge-duration">${video.duration}</div>
                        <div class="play-overlay">
                            <div class="play-btn-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            </div>
                        </div>
                    </div>
                    <div class="card-content">
                        <div class="card-meta-row">
                            <div class="author-box">
                                <div class="author-avatar">${video.author[0].toUpperCase()}</div>
                                <span>${video.author}</span>
                            </div>
                            <span class="stat-text">👁️ ${video.views}</span>
                        </div>
                        <div class="card-title">${video.title}</div>
                        <div class="card-footer">
                            <span class="stat-text">ID: #${video.id}</span>
                            <button class="btn-icon" onclick="event.stopPropagation(); deleteVideo(${video.id})" title="Удалить ролик">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setFilter(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            filterVideos();
        }

        function filterVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = videosData.filter(v => {
                const matchCategory = currentCategory === 'Все' || v.category === currentCategory;
                const matchQuery = v.title.toLowerCase().includes(query) || v.author.toLowerCase().includes(query);
                return matchCategory && matchQuery;
            });
            renderVideos(filtered);
        }

        // Удаление видео
        function deleteVideo(id) {
            const index = videosData.findIndex(v => v.id === id);
            if (index !== -1) {
                videosData.splice(index, 1);
                filterVideos();
                showToast('Ролик успешно удален', 'error');
            }
        }

        // Модалка добавления видео
        function openAddModal() {
            document.getElementById('addVideoModal').classList.add('active');
        }
        function closeAddModal(e) {
            if (e.target.id === 'addVideoModal') closeAddModalDirect();
        }
        function closeAddModalDirect() {
            document.getElementById('addVideoModal').classList.remove('active');
        }

        // Выделение YouTube ID из ссылки, если юзер вставил полный урл
        function extractYtId(urlOrId) {
            if (!urlOrId) return 'dQw4w9WgXcQ';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : urlOrId.trim();
        }

        function submitNewVideo(e) {
            e.preventDefault();
            const title = document.getElementById('newVideoTitle').value;
            const rawYt = document.getElementById('newVideoYt').value;
            const category = document.getElementById('newVideoCategory').value;
            const author = document.getElementById('newVideoAuthor').value;
            
            const ytId = extractYtId(rawYt);
            const newId = videosData.length > 0 ? Math.max(...videosData.map(v => v.id)) + 1 : 1;
            
            videosData.unshift({
                id: newId,
                title: title,
                category: category,
                author: author,
                duration: "03:15",
                ytId: ytId || "dQw4w9WgXcQ",
                views: "1"
            });
            
            filterVideos();
            closeAddModalDirect();
            document.getElementById('addVideoForm').reset();
            showToast('Видос успешно закинут в хаб!', 'success');
        }

        // Плеер
        function openPlayer(video) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('playerIframe');
            document.getElementById('playerModalTitle').innerText = video.title;
            document.getElementById('playerModalAuthor').innerText = `Автор: ${video.author} • Категория: ${video.category}`;
            iframe.src = `https://www.youtube.com/embed/${video.ytId}?autoplay=1`;
            modal.classList.add('active');
        }

        function closePlayerModal(e) {
            if (e.target.id === 'playerModal') {
                closePlayerModalDirect();
            }
        }

        function closePlayerModalDirect() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('playerIframe');
            iframe.src = '';
            modal.classList.remove('active');
        }

        function switchMainTab(tabId, el) {
            document.getElementById('videos-tab').style.display = 'none';
            document.getElementById('feed-tab').style.display = 'none';
            document.getElementById('settings-tab').style.display = 'none';

            document.getElementById(tabId).style.display = 'block';
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function showToast(text, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${text}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Инициализация
        window.onload = () => {
            switchMainTab('videos-tab', null);
            renderVideos(videosData);
        };
    </script>
</body>
</html>
